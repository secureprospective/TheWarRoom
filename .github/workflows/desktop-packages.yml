name: desktop packages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-amd64
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config
      - name: Check native target and toolchain
        run: |
          python -c 'import sys; sys.path.insert(0,"scripts/desktop"); import package; assert package.target() == "${{ matrix.target }}", package.target()'
          go version
          go env GOOS GOARCH CGO_ENABLED
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend on native filesystem
        run: cd frontend && pnpm install --frozen-lockfile && pnpm build
      - name: Archive and platform-lock regressions
        run: python -m unittest discover -s scripts/desktop -v
      - name: Build package and smoke extracted executable
        run: python scripts/desktop/package.py
      - name: No bindings or tracked build changes
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.target }}-${{ github.sha }}
          path: .tmp/desktop/artifacts/*
          if-no-files-found: error
          retention-days: 14
