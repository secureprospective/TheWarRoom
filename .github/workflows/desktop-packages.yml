name: desktop packages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-amd64
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config
      - name: Windows installer tools
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - name: Stage Microsoft-signed Evergreen WebView2 bootstrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tmp/desktop | Out-Null
          $file = "$PWD/.tmp/desktop/MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $file
          $signature = Get-AuthenticodeSignature $file
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw 'WebView2 bootstrapper is not authenticated as Microsoft software'
          }
      - name: Check native target and toolchain
        run: |
          python -c 'import sys; sys.path.insert(0,"scripts/desktop"); import package; assert package.target() == "${{ matrix.target }}", package.target()'
          go version
          go env GOOS GOARCH CGO_ENABLED
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend on native filesystem
        run: cd frontend && pnpm install --frozen-lockfile && pnpm build
      - name: Package and platform-lock regressions
        run: python -m unittest discover -s scripts/desktop -v
      - name: Build installable package
        run: python scripts/desktop/package.py
      - name: No bindings or tracked build changes
        run: git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}-${{ github.sha }}
          path: .tmp/desktop/artifacts/*
          if-no-files-found: error
          retention-days: 14

  install:
    name: install (${{ matrix.target }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-amd64
            extension: exe
          - runner: macos-15
            target: darwin-arm64
            extension: dmg
          - runner: ubuntu-24.04
            target: linux-amd64
            extension: deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-${{ matrix.target }}-${{ github.sha }}
          path: .tmp/download
      - name: Linux virtual desktop (runtime libraries come from the package)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgtk-3-bin
      - name: Install downloaded package and exercise installed WebView and lock
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            xvfb-run -a python scripts/desktop/install_smoke.py .tmp/download/warroom-${{ matrix.target }}.${{ matrix.extension }}
          else
            python scripts/desktop/install_smoke.py .tmp/download/warroom-${{ matrix.target }}.${{ matrix.extension }}
          fi
