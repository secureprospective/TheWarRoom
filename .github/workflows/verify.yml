# The full gate on GitHub: lint, race tests on every package, and the frontend build. It runs on every
# push and pull request, so the merge (not the push) waits for the full suite. The local pre-push hook
# runs only what the push touched (scripts/prepush.sh).
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install tools
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Frontend install
        run: cd frontend && pnpm install --frozen-lockfile && pnpm build
      - name: Verify
        run: make verify
