# The full gate on GitHub: lint, race tests on every package, and the frontend build. It runs on every
# push (a pull request reuses the push run for the same commit), so the merge (not the push) waits for
# the full suite. The race suite is split across four runners by scripts/ci-shard.sh; the "verify" job
# is the one required check and passes only when lint and every shard pass. The local pre-push hook runs
# only what the push touched (scripts/prepush.sh).
name: verify

on:
  push:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install tools
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Frontend install
        run: cd frontend && pnpm install --frozen-lockfile && pnpm build
      - name: Secret scan, full history
        run: gitleaks git --redact --no-banner .
      - name: Dependency audit, shipped app (blocking)
        run: cd frontend && pnpm audit --prod
      - name: Dependency audit, dev toolchain (blocking)
        run: cd frontend && pnpm audit
      - name: Lint (with placement and root ratchet), bindings, frontend checks
        run: |
          make lint
          scripts/check-wails-version.sh
          govulncheck ./...
          make bindings-fresh
          cd frontend && pnpm tsc --noEmit && pnpm test && pnpm run build && node scripts/bundle-budget.mjs && node scripts/csp-check.mjs

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend build (embedded by package main)
        run: cd frontend && pnpm install --frozen-lockfile && pnpm build
      - name: Race tests, shard ${{ matrix.shard }} of 4
        run: scripts/ci-shard.sh ${{ matrix.shard }} 4

  verify:
    runs-on: ubuntu-24.04
    needs: [checks, test]
    if: always()
    steps:
      - name: Every check and shard passed
        run: test "${{ needs.checks.result }}" = success && test "${{ needs.test.result }}" = success
