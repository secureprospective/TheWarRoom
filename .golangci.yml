# golangci-lint v2 configuration, from the christopher-coding-standards Go overlay. The
# depguard rules are the import boundaries docs/architecture/system-narrative.md describes.

version: "2"

run:
  timeout: 5m
  # This LXC is RAM-constrained (~2 GiB). exhaustive + staticcheck at default
  # concurrency OOM-kill golangci-lint; pin to 1 (codebase is small, speed is fine).
  concurrency: 1

linters:
  # Start from nothing; enable exactly the must-have set (Section 1 + 2 of the
  # companion plan). Avoids surprise linters a weaker model can't reason about.
  default: none
  enable:
    # Security and correctness first.
    - gosec          # SAST: SQL string-building, weak crypto, path traversal.
    - errcheck       # Unchecked errors. Non-negotiable in a scoring/financial engine.
    - govet          # Standard vet suite.
    - staticcheck    # High-value correctness (SA checks).
    - ineffassign    # Ineffectual assignments.
    - unused         # Dead code.

    # Structure and complexity.
    - gocyclo        # Cyclomatic complexity ceiling.
    - funlen         # FUNCTION length only (lines:60/statements:40). Note: this
                     # does NOT enforce the 250/400-line FILE cap — no linter
                     # does. The file cap is gated by the Makefile `filelen`
                     # target (Confidence-80 sweep, 2026-06-13).
    - revive         # gofmt-plus style/naming layer.

    # Resource and DB hygiene.
    - bodyclose      # Unclosed HTTP response bodies (B1 fetchers).
    - sqlclosecheck  # Unclosed sql.Rows / sql.Stmt.
    - rowserrcheck   # Unchecked rows.Err().

    # Context discipline (B1/B2 take context.Context as first arg).
    - containedctx
    - contextcheck

    # The five weaker-model failure modes this guardrail set targets directly.
    - gochecknoglobals  # Failure mode #5: package-level globals / hidden state.
    - depguard          # Failure mode #9: cross-layer / cyclic imports → build error.
    - gocritic          # Failure mode #1: interface{}/any escapes, style/perf issues.
    - interfacebloat    # Failure mode #1: oversized interfaces (any-shaped escapes).
    - wrapcheck         # Failure mode #8: silent error drops / unwrapped errors.
    - forbidigo         # Default rule set: bans fmt.Print*/println debug statements.
                        # NOTE: AD-06 (playerid.PlayerID bypass conversion) is NOT
                        # enforced here — forbidigo cannot tell a conversion call from
                        # a type reference (Friction #6). It is enforced at COMPILE
                        # time instead by struct-wrapping PlayerID (unexported field;
                        # see templates/go/playerid/example.go). interface{}/any escapes
                        # (Friction #10) are enforced by the ifaceguard vettool
                        # (tools/ifaceguard), run from `make lint` + pre-commit.

    # Domain-safety + bypass-prevention (added at B0 from the Gemini Round-1 review).
    - nolintlint        # //nolint must be specific + explained — closes the bypass
                        #   loophole on the depguard three-layer law.
    - exhaustive        # enum switch exhaustiveness — a missing case in a position/
                        #   state switch fails the build (scoring/state-machine safety).
    - nilerr            # bans `if err != nil { return nil }` — silent error swallow.

  settings:
    gocyclo:
      min-complexity: 15

    funlen:
      lines: 60
      statements: 40

    # nolintlint hardens the //nolint escape hatch: every directive must name a
    # specific linter and carry an explanation, so a bypass of the three-layer law
    # is impossible to slip in silently. gochecknoglobals and wrapcheck run on
    # defaults — they take NO settings block (an empty {} is rejected by
    # `golangci-lint config verify`; confirmed at B0).
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    depguard:
      rules:
        core-no-features:
          list-mode: lax
          files:
            - "**/internal/app/core/**"
          allow:
            - github.com/secureprospective/TheWarRoom/internal/app/core$
            - github.com/secureprospective/TheWarRoom/internal/app/core/
            - github.com/secureprospective/TheWarRoom/internal/app/report$
            - github.com/secureprospective/TheWarRoom/internal/app/report/
            - github.com/secureprospective/TheWarRoom/internal/app/season$
            - github.com/secureprospective/TheWarRoom/internal/app/season/
            - github.com/secureprospective/TheWarRoom/internal/app/catalog$
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/app/
              desc: "core cannot import features; compose feature ports in main"
            - pkg: github.com/wailsapp/wails
              desc: "core cannot import Wails; inject the runtime port"

        app-boundary-no-core-imports:
          list-mode: lax
          files:
            - "**/internal/app/**"
            - "!**/internal/app/core/**"
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/app/core
              desc: "features cannot import core; own a narrow Host port instead"

        internal-no-app-imports:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/internal/app/**"
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/app
              desc: "non-app internals cannot import application services"
            - pkg: github.com/secureprospective/TheWarRoom$
              desc: "internals cannot import the root composition package"

        app-no-platform-imports:
          list-mode: lax
          files:
            - "**/internal/app/**"
          deny:
            - pkg: github.com/wailsapp/wails
              desc: "application services cannot import Wails; inject a callback at root"
            - pkg: github.com/secureprospective/TheWarRoom$
              desc: "services cannot import the root composition package"

        # Shared set: report and season. Unknown features default to shared-only imports;
        # declare their own subtree below when extracting a feature (including tests).
        app-new-feature-shared-only:
          list-mode: lax
          files:
            - "**/internal/app/**"
            - "!**/internal/app/core/**"
            - "!**/internal/app/archive/**"
            - "!**/internal/app/comms/**"
            - "!**/internal/app/counterparties/**"
            - "!**/internal/app/draft/**"
            - "!**/internal/app/scoring/**"
            - "!**/internal/app/sources/**"
            - "!**/internal/app/market/**"
            - "!**/internal/app/research/**"
            - "!**/internal/app/report/**"
            - "!**/internal/app/season/**"
            - "!**/internal/app/race/**"
            - "!**/internal/app/now/**"
          allow:
            - github.com/secureprospective/TheWarRoom/internal/app/report$
            - github.com/secureprospective/TheWarRoom/internal/app/report/
            - github.com/secureprospective/TheWarRoom/internal/app/season$
            - github.com/secureprospective/TheWarRoom/internal/app/season/
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/app/
              desc: "feature services may import only their own subtree and shared report/season"

        app-archive-no-siblings:
          list-mode: lax
          files:
            - "**/internal/app/archive/**"
          allow:
            - github.com/secureprospective/TheWarRoom/internal/app/catalog$
            - github.com/secureprospective/TheWarRoom/internal/app/archive$
            - github.com/secureprospective/TheWarRoom/internal/app/archive/
            - github.com/secureprospective/TheWarRoom/internal/app/report$
            - github.com/secureprospective/TheWarRoom/internal/app/report/
            - github.com/secureprospective/TheWarRoom/internal/app/season$
            - github.com/secureprospective/TheWarRoom/internal/app/season/
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/app/
              desc: "feature services may import only their own subtree, shared report/season and catalog"

        app-comms-no-siblings:
          list-mode: lax
          files:
            - "**/internal/app/comms/**"
          allow:
            - github.com/secureprospective/TheWarRoom/internal/app/catalog$
            - github.com/secureprospective/TheWarRoom/internal/app/comms$
            - github.com/secureprospective/TheWarRoom/internal/app/comms/
            - github.com/secureprospective/TheWarRoom/internal/app/report$
            - github.com/secureprospective/TheWarRoom/internal/app/report/
            - github.com/secureprospective/TheWarRoom/internal/app/season$
            - github.com/secureprospective/TheWarRoom/internal/app/season/
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/app/
              desc: "feature services may import only their own subtree, shared report/season and catalog"

        app-counterparties-no-siblings:
          list-mode: lax
          files:
            - "**/internal/app/counterparties/**"
          allow:
            - github.com/secureprospective/TheWarRoom/internal/app/catalog$
            - github.com/secureprospective/TheWarRoom/internal/app/counterparties$
            - github.com/secureprospective/TheWarRoom/internal/app/counterparties/
            - github.com/secureprospective/TheWarRoom/internal/app/report$
            - github.com/secureprospective/TheWarRoom/internal/app/report/
            - github.com/secureprospective/TheWarRoom/internal/app/season$
            - github.com/secureprospective/TheWarRoom/internal/app/season/
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/app/
              desc: "feature services may import only their own subtree, shared report/season and catalog"

        app-scoring-no-siblings:
          list-mode: lax
          files:
            - "**/internal/app/scoring/**"
          allow:
            - github.com/secureprospective/TheWarRoom/internal/app/scoring$
            - github.com/secureprospective/TheWarRoom/internal/app/scoring/
            - github.com/secureprospective/TheWarRoom/internal/app/report$
            - github.com/secureprospective/TheWarRoom/internal/app/report/
            - github.com/secureprospective/TheWarRoom/internal/app/season$
            - github.com/secureprospective/TheWarRoom/internal/app/season/
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/app/
              desc: "feature services may import only their own subtree and shared report/season"

        app-race-no-siblings:
          list-mode: lax
          files:
            - "**/internal/app/race/**"
          allow:
            - github.com/secureprospective/TheWarRoom/internal/app/race$
            - github.com/secureprospective/TheWarRoom/internal/app/race/
            - github.com/secureprospective/TheWarRoom/internal/app/report$
            - github.com/secureprospective/TheWarRoom/internal/app/report/
            - github.com/secureprospective/TheWarRoom/internal/app/season$
            - github.com/secureprospective/TheWarRoom/internal/app/season/
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/app/
              desc: "feature services may import only their own subtree and shared report/season"

        app-now-no-siblings:
          list-mode: lax
          files:
            - "**/internal/app/now/**"
          allow:
            - github.com/secureprospective/TheWarRoom/internal/app/now$
            - github.com/secureprospective/TheWarRoom/internal/app/now/
            - github.com/secureprospective/TheWarRoom/internal/app/report$
            - github.com/secureprospective/TheWarRoom/internal/app/report/
            - github.com/secureprospective/TheWarRoom/internal/app/season$
            - github.com/secureprospective/TheWarRoom/internal/app/season/
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/app/
              desc: "feature services may import only their own subtree and shared report/season"

        app-season-no-siblings:
          list-mode: lax
          files:
            - "**/internal/app/season/**"
          allow:
            - github.com/secureprospective/TheWarRoom/internal/app/report$
            - github.com/secureprospective/TheWarRoom/internal/app/report/
            - github.com/secureprospective/TheWarRoom/internal/app/season$
            - github.com/secureprospective/TheWarRoom/internal/app/season/
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/app/
              desc: "feature services may import only their own subtree and shared report/season"

        app-sources-no-siblings:
          list-mode: lax
          files:
            - "**/internal/app/sources/**"
          allow:
            - github.com/secureprospective/TheWarRoom/internal/app/sources$
            - github.com/secureprospective/TheWarRoom/internal/app/sources/
            - github.com/secureprospective/TheWarRoom/internal/app/report$
            - github.com/secureprospective/TheWarRoom/internal/app/report/
            - github.com/secureprospective/TheWarRoom/internal/app/season$
            - github.com/secureprospective/TheWarRoom/internal/app/season/
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/app/
              desc: "feature services may import only their own subtree and shared report/season"

        app-draft-no-siblings:
          list-mode: lax
          files:
            - "**/internal/app/draft/**"
          allow:
            - github.com/secureprospective/TheWarRoom/internal/app/draft$
            - github.com/secureprospective/TheWarRoom/internal/app/draft/
            - github.com/secureprospective/TheWarRoom/internal/app/report$
            - github.com/secureprospective/TheWarRoom/internal/app/report/
            - github.com/secureprospective/TheWarRoom/internal/app/season$
            - github.com/secureprospective/TheWarRoom/internal/app/season/
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/app/
              desc: "feature services may import only their own subtree and shared report/season"

        app-market-no-siblings:
          list-mode: lax
          files:
            - "**/internal/app/market/**"
          allow:
            - github.com/secureprospective/TheWarRoom/internal/app/market$
            - github.com/secureprospective/TheWarRoom/internal/app/market/
            - github.com/secureprospective/TheWarRoom/internal/app/report$
            - github.com/secureprospective/TheWarRoom/internal/app/report/
            - github.com/secureprospective/TheWarRoom/internal/app/season$
            - github.com/secureprospective/TheWarRoom/internal/app/season/
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/app/
              desc: "feature services may import only their own subtree and shared report/season"

        app-research-no-siblings:
          list-mode: lax
          files:
            - "**/internal/app/research/**"
          allow:
            - github.com/secureprospective/TheWarRoom/internal/app/research$
            - github.com/secureprospective/TheWarRoom/internal/app/research/
            - github.com/secureprospective/TheWarRoom/internal/app/report$
            - github.com/secureprospective/TheWarRoom/internal/app/report/
            - github.com/secureprospective/TheWarRoom/internal/app/season$
            - github.com/secureprospective/TheWarRoom/internal/app/season/
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/app/
              desc: "feature services may import only their own subtree and shared report/season"

        app-report-no-siblings:
          list-mode: lax
          files:
            - "**/internal/app/report/**"
          allow:
            - github.com/secureprospective/TheWarRoom/internal/app/report$
            - github.com/secureprospective/TheWarRoom/internal/app/report/
            - github.com/secureprospective/TheWarRoom/internal/app/season$
            - github.com/secureprospective/TheWarRoom/internal/app/season/
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/app/
              desc: "feature services may import only their own subtree and shared report/season"

        # Layer 1 (transport + ingestion + normalization) never imports up into
        # the engine, stores, transactions, or the IPC/API layer
        # (companion plan Section 8A.2 — the three-layer law as a build error).
        # normalize added at B0 (Gemini Round-1 finding #4): it is Layer 1 (B3) and
        # was previously unrestricted.
        layer1-no-upward-import:
          list-mode: lax
          files:
            - "**/internal/mfl/**"
            - "**/internal/ingestion/**"
            - "**/internal/normalize/**"
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/engine
              desc: "Layer 1 (transport/ingestion/normalize) cannot import the engine (Layer 2/3)"
            - pkg: github.com/secureprospective/TheWarRoom/internal/store
              desc: "Layer 1 cannot import stores"
            - pkg: github.com/secureprospective/TheWarRoom/internal/transactions
              desc: "Layer 1 cannot import the transaction coordinator"
            - pkg: github.com/secureprospective/TheWarRoom/internal/api
              desc: "Layer 1 cannot import the IPC/API layer (reserved package name)"
            - pkg: database/sql
              desc: "Layer 1 performs no I/O beyond HTTP transport — no direct DB access"

        # The engine is a pure-function pipeline (Section 3.5). It must not reach
        # sideways into ingestion/normalize, stores, transactions,
        # the DB driver, OR the network/filesystem — every input arrives as a
        # parameter. net/http/net/os added at B0 (Gemini Round-1 finding #5): the
        # internal-only blacklist let a pure layer still reach I/O directly.
        engine-is-pure:
          list-mode: lax
          files:
            - "**/internal/engine/**"
            - "**/internal/model/**"
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/mfl
              desc: "engine cannot import the transport client"
            - pkg: github.com/secureprospective/TheWarRoom/internal/ingestion
              desc: "engine cannot import ingestion"
            - pkg: github.com/secureprospective/TheWarRoom/internal/normalize
              desc: "engine cannot import normalize — domain values arrive as parameters"
            - pkg: github.com/secureprospective/TheWarRoom/internal/store
              desc: "engine cannot import stores — all state arrives as parameters"
            - pkg: github.com/secureprospective/TheWarRoom/internal/transactions
              desc: "engine cannot import the transaction coordinator"
            - pkg: github.com/secureprospective/TheWarRoom/internal/db
              desc: "engine performs no I/O"
            - pkg: database/sql
              desc: "engine performs no I/O"
            - pkg: net/http
              desc: "engine is pure — no network access"
            - pkg: net
              desc: "engine is pure — no network access"
            - pkg: os
              desc: "engine is pure — no filesystem/env access"

        # Stores never import each other (companion plan Section 8A.3 — "no
        # store package imports another store package"). Three rules, one
        # per sibling, each denying the other two.
        store-rulebook-no-siblings:
          list-mode: lax
          files:
            - "**/internal/store/rulebook/**"
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/store/state
              desc: "stores never import each other — rulebook cannot import state"
            - pkg: github.com/secureprospective/TheWarRoom/internal/store/params
              desc: "stores never import each other — rulebook cannot import params"
            - pkg: github.com/secureprospective/TheWarRoom/internal/store/history
              desc: "stores never import each other — rulebook cannot import history"

        store-state-no-siblings:
          list-mode: lax
          files:
            - "**/internal/store/state/**"
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/store/rulebook
              desc: "stores never import each other — state cannot import rulebook"
            - pkg: github.com/secureprospective/TheWarRoom/internal/store/params
              desc: "stores never import each other — state cannot import params"
            - pkg: github.com/secureprospective/TheWarRoom/internal/store/history
              desc: "stores never import each other — state cannot import history"

        store-params-no-siblings:
          list-mode: lax
          files:
            - "**/internal/store/params/**"
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/store/rulebook
              desc: "stores never import each other — params cannot import rulebook"
            - pkg: github.com/secureprospective/TheWarRoom/internal/store/state
              desc: "stores never import each other — params cannot import state"
            - pkg: github.com/secureprospective/TheWarRoom/internal/store/history
              desc: "stores never import each other — params cannot import history"

        # The history store (Stage 1) holds everything the app cannot rebuild: the
        # fetch archive, observations and scoring runs. It imports the engine (for the
        # pure Result value type), the measures registry and the archive's Fetch type,
        # but never another store.
        store-history-no-siblings:
          list-mode: lax
          files:
            - "**/internal/store/history/**"
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/store/rulebook
              desc: "stores never import each other — history cannot import rulebook"
            - pkg: github.com/secureprospective/TheWarRoom/internal/store/state
              desc: "stores never import each other — history cannot import state"
            - pkg: github.com/secureprospective/TheWarRoom/internal/store/params
              desc: "stores never import each other — history cannot import params"

        # The measures registry and the fetch archive are leaves: everything above
        # them may import them, so they import nothing of the app's beyond domain
        # values. Their tests may reach further (the registry test checks every
        # fetcher's URL against sources.csv).
        measures-is-a-leaf:
          list-mode: strict
          files:
            - "**/internal/measures/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/secureprospective/TheWarRoom/internal/domain
        facts-is-pure:
          list-mode: strict
          files:
            - "**/internal/facts/**"
            - "!$test"
          allow:
            - bytes
            - cmp
            - context
            - crypto/sha256
            - encoding/csv
            - encoding/hex
            - encoding/json
            - fmt
            - math
            - reflect
            - regexp
            - slices
            - sort
            - strconv
            - strings
            - time$
            - time/tzdata
            - unicode/utf16
        labcompile-is-pure:
          list-mode: strict
          files:
            - "**/internal/labcompile/**"
            - "!$test"
          allow:
            - context
            - embed
            - encoding/json
            - fmt
            - hash/crc32
            - math$
            - math/big
            - regexp
            - slices
            - strconv
            - strings
            - time$
            - github.com/secureprospective/TheWarRoom/internal/facts
            - github.com/secureprospective/TheWarRoom/internal/lab
        archive-is-a-leaf:
          list-mode: strict
          files:
            - "**/internal/archive/**"
            - "!$test"
          allow:
            - $gostd

        # SQL stays confined to the db and store packages (Section 2, item 6
        # — "depguard keeps SQL out of non-repository packages"). Every other
        # package — including transactions handlers, the engine, ingestion,
        # and the IPC layer — gets a Store/ReadOnlyStore, never raw SQL.
        sql-confined-to-data-layer:
          list-mode: lax
          files:
            - "!**/internal/db/**"
            - "!**/internal/store/**"
          deny:
            - pkg: database/sql
              desc: "raw database/sql is confined to internal/db and internal/store"
            - pkg: modernc.org/sqlite
              desc: "the sqlite driver is confined to internal/db and internal/store"

        # Only the B7 coordinator (internal/transactions root package) is
        # importable from the rest of the app. Handler subpackages
        # (acquisitions/contracts/deadcap) are implementation detail behind
        # the Coordinator.Execute interface (AD-02, Section 4 WF 6).
        transactions-only-through-coordinator:
          list-mode: lax
          files:
            - "!**/internal/transactions/**"
          deny:
            - pkg: github.com/secureprospective/TheWarRoom/internal/transactions/acquisitions
              desc: "transaction handlers are internal to the coordinator — call Coordinator.Execute"
            - pkg: github.com/secureprospective/TheWarRoom/internal/transactions/contracts
              desc: "transaction handlers are internal to the coordinator — call Coordinator.Execute"
            - pkg: github.com/secureprospective/TheWarRoom/internal/transactions/deadcap
              desc: "transaction handlers are internal to the coordinator — call Coordinator.Execute"
            - pkg: github.com/secureprospective/TheWarRoom/internal/transactions/freeagency
              desc: "transaction handlers are internal to the coordinator — call Coordinator.Execute"

  exclusions:
    generated: lax
    warn-unused: true
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      # Standard test-file relief: table-driven tests legitimately exceed
      # cyclomatic/length limits and don't need full error-wrap ceremony.
      - path: _test\.go
        linters:
          - gocyclo
          - funlen
          - wrapcheck

formatters:
  enable:
    - gofmt
    - goimports
