repos:
  # golangci-lint: full lint suite on staged commit (Section 1 linter set).
  # Local hook matching upstream golangci-lint-full (v2.12.2) via scripts/golangci-cache.sh
  # so each worktree gets its own GOLANGCI_LINT_CACHE.
  - repo: local
    hooks:
      - id: golangci-lint-full
        name: golangci-lint-full
        description: Fast linters runner for Go. Runs on all files in the module. Use this hook if you use pre-commit in CI.
        entry: scripts/golangci-cache.sh run --fix
        language: system
        types: [go]
        require_serial: true
        pass_filenames: false
        stages: [pre-commit]

  # Gitleaks: scan staged files for secrets before they enter git history.
  # Pinned to the commit SHA for tag v8.30.1 — verify with:
  #   git ls-remote https://github.com/gitleaks/gitleaks v8.30.1
  # Reason: supply chain attacks target mutable tags (docs/adr/0001-why-this-standard-exists.md,
  # the trivy-action lesson — AGENTS.md hard rule).
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  # ifaceguard: custom go/analysis vettool — blocks empty-interface
  # (interface{}/any) escapes in exported signatures (the gap no golangci-lint
  # linter covers — Fable Friction #10). It is local (not a pinned remote repo)
  # because the analyzer source lives in this repo under tools/ifaceguard; its
  # OWN supply chain is pinned in tools/ifaceguard/go.mod + go.sum. The hook
  # delegates to `make ifaceguard`, which builds the vettool and runs
  # `go vet -vettool`.
  - repo: local
    hooks:
      - id: ifaceguard
        name: ifaceguard (empty-interface escapes in exported signatures)
        entry: make ifaceguard
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit]

      - id: frontend-controls
        name: frontend controls & TS line length (<=110)
        entry: pnpm --dir frontend test -- src/app/commands/controls.test.ts
        language: system
        files: ^frontend/(src/|tsconfig(\.node)?\.json$|vite\.config\.ts$|package\.json$|pnpm-lock\.yaml$)
        pass_filenames: false
        stages: [pre-commit]

      - id: frontend-tsc
        name: frontend typecheck (tsc --noEmit)
        entry: pnpm --dir frontend exec tsc --noEmit
        language: system
        files: ^frontend/(src/|tsconfig(\.node)?\.json$|vite\.config\.ts$|package\.json$|pnpm-lock\.yaml$)
        pass_filenames: false
        stages: [pre-commit]

  # verify: a quick local gate: lint and build all for Go changes, test directly changed
  # packages (except composition), and run frontend checks for frontend changes.
  # GitHub CI runs the full suite on every push, and the merge waits for it.
  # always_run: a hook with no file filter can be skipped when the computed delta is empty.
  - repo: local
    hooks:
      - id: verify
        name: verify (changed packages; full suite in CI)
        entry: scripts/prepush.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
