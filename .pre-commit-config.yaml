repos:
  # golangci-lint: full lint suite on staged commit (Section 1 linter set).
  # Pinned to the commit SHA for tag v2.12.2 — verify with:
  #   git ls-remote https://github.com/golangci/golangci-lint v2.12.2
  - repo: https://github.com/golangci/golangci-lint
    rev: c0d3ddc9cf3faa61a4e378e879ece580256d76e5  # v2.12.2
    hooks:
      - id: golangci-lint-full
        stages: [commit]

  # Gitleaks: scan staged files for secrets before they enter git history.
  # Pinned to the commit SHA for tag v8.30.1 — verify with:
  #   git ls-remote https://github.com/gitleaks/gitleaks v8.30.1
  # Reason: supply chain attacks target mutable tags (docs/adr/0001-why-this-standard-exists.md,
  # the trivy-action lesson — AGENTS.md hard rule).
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
        stages: [commit]

  # ifaceguard: custom go/analysis vettool — blocks empty-interface
  # (interface{}/any) escapes in exported signatures (the gap no golangci-lint
  # linter covers — Fable Friction #10). It is local (not a pinned remote repo)
  # because the analyzer source lives in this repo under tools/ifaceguard; its
  # OWN supply chain is pinned in tools/ifaceguard/go.mod + go.sum. The hook
  # delegates to `make ifaceguard`, which builds the vettool and runs
  # `go vet -vettool`.
  - repo: local
    hooks:
      - id: ifaceguard
        name: ifaceguard (empty-interface escapes in exported signatures)
        entry: make ifaceguard
        language: system
        types: [go]
        pass_filenames: false
        stages: [commit]

  # verify: the full pre-push gate — everything `make lint` covers plus the
  # race-enabled test suite and the frontend build. Direct-to-main has no PR/CI
  # backstop, so this is the last local check before a commit reaches origin.
  # Runs at the pre-push stage, not pre-commit, so small WIP commits between
  # pushes stay fast — `make setup` wires both hook types per clone (see
  # CLAUDE.md dev setup). always_run: true (GLM 5.2 review, B1): a hook with
  # no files/types filter is NOT guaranteed to fire on every push without it —
  # pre-commit can skip a file-scoped hook when the push's computed file delta
  # is empty (e.g. a tag-only push, or a merge/rebase that lands an identical
  # tree). This gate exists precisely for the no-PR/no-CI corner cases, so it
  # must not have a corner case of its own where it silently no-ops.
  - repo: local
    hooks:
      - id: verify
        name: verify (full gate — lint, race tests, frontend build)
        entry: make verify
        language: system
        pass_filenames: false
        always_run: true
        stages: [push]
