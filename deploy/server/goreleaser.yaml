version: 2
project_name: twr-server
dist: .scratch/goreleaser
builds:
  - id: twr-server
    main: ./cmd/twr-server
    binary: twr-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Env.TWR_BUILD_VERSION }} -X main.commit={{ .Env.TWR_BUILD_COMMIT }} -X main.buildDate={{ .Env.TWR_BUILD_DATE }}
