<!doctype html><html lang="en"><head><meta charset="utf-8"><title>TheWarRoom · Control Room mock v1</title><style>
:root{
  --canvas:hsl(220,20%,6%); --sunken:hsl(220,22%,4%); --tile:hsl(220,18%,9%); --raised:hsl(220,18%,12%);
  --ink:hsl(220,20%,94%); --ink2:hsl(220,12%,74%); --ink3:hsl(220,10%,56%);
  --edge:hsl(220,10%,28%); --edge-hi:hsl(220,8%,82%); --black:hsl(220,25%,2%); --rule:hsl(220,15%,13%);
  --green:hsl(145,50%,58%); --blue:hsl(210,80%,66%); --amber:hsl(38,92%,58%); --red:hsl(358,75%,62%);
  --mono:"JetBrains Mono","DejaVu Sans Mono",monospace; --sans:"Inter","Noto Sans",system-ui,sans-serif;
  --knurl:repeating-linear-gradient(45deg,hsla(0,0%,100%,.035) 0 1px,transparent 1px 4px),
          repeating-linear-gradient(-45deg,hsla(0,0%,0%,.35) 0 1px,transparent 1px 4px);
  --hazard:repeating-linear-gradient(-45deg,var(--edge-hi) 0 6px,var(--black) 6px 12px);
  --hatch:repeating-linear-gradient(-45deg,hsla(220,8%,82%,.10) 0 5px,transparent 5px 10px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--canvas);color:var(--ink);font:13px/1.35 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono,.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:224px 1fr 316px;height:100%}

/* ---------- rail (option 3, ruled) ---------- */
.rail{background:var(--tile);background-image:var(--knurl);border-right:3px solid var(--black);display:flex;flex-direction:column}
.rail-head{padding:14px 14px 12px;border-bottom:2px solid var(--black)}
.lg{font:700 12px var(--mono);letter-spacing:.16em}
.ph{margin-top:6px;font:11px var(--mono);color:var(--ink2)} .ph i{font-style:normal;color:var(--green)}
.rail-body{flex:1;padding:6px 0;overflow:hidden}
.gl{padding:10px 14px 4px;font:600 10px var(--mono);letter-spacing:.16em;color:var(--ink3)}
.node>.nb{width:100%;display:flex;align-items:center;gap:10px;padding:8px 14px;text-align:left;font-weight:600;border-left:4px solid transparent;transition:transform 70ms linear}
.nb .k{font:11px var(--mono);color:var(--ink3);width:10px}
.nb .car{margin-left:auto;font:11px var(--mono);color:var(--ink3)}
.nb:hover{transform:translateX(2px);background:var(--raised)}
.node.open>.nb{background:var(--raised);border-image:var(--hazard) 1}
.node.open .car{transform:rotate(90deg)}
.mark{width:6px;height:6px;background:var(--green);margin-left:4px}
.leaf{display:flex;gap:6px;width:100%;padding:5px 14px 5px 26px;text-align:left;color:var(--ink2);font-size:12.5px;transition:transform 70ms linear}
.leaf:hover{color:var(--ink);transform:translateX(2px)}
.leaf .tr{font-family:var(--mono);color:var(--edge)}
.leaf.sel{color:var(--ink);font-weight:600} .leaf.sel .tr::after{content:"▮";color:var(--edge-hi)}
.leaf.now{border:1px solid var(--edge);margin:2px 10px 4px 22px;width:calc(100% - 32px);padding-left:8px;color:var(--ink)}
.tag{font:700 9px var(--mono);letter-spacing:.12em;background:var(--edge-hi);color:var(--black);padding:1px 4px;align-self:center}
.rail-foot{border-top:2px solid var(--black);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font:11px var(--mono);color:var(--ink3)}

/* ---------- shared controls ---------- */
.btn{border:2px solid var(--edge);padding:6px 11px;font:600 11px var(--mono);letter-spacing:.06em;transition:transform 70ms linear,box-shadow 70ms linear}
.btn:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--black);border-color:var(--edge-hi)}
.btn:active{transform:none;box-shadow:none}
.btn.g2{border-width:2px;border-color:var(--edge-hi)}
.btn.solid{background:var(--edge-hi);color:var(--black);border-color:var(--edge-hi)}
.pg{display:inline-block;min-width:26px;text-align:center;border:1px solid var(--ink3);font:600 10px var(--mono);padding:0 3px;color:var(--ink2)}

/* ---------- workspace ---------- */
.work{position:relative;display:grid;grid-template-rows:auto auto 1fr auto;min-width:0;overflow:hidden}
.ws-tabs{display:flex;align-items:stretch;border-bottom:2px solid var(--black);background:var(--sunken)}
.ws-tabs button{padding:11px 16px;font:600 11px var(--mono);letter-spacing:.1em;color:var(--ink3);border-right:1px solid var(--black)}
.ws-tabs button[aria-selected=true]{color:var(--ink);background:var(--canvas);box-shadow:inset 0 3px 0 var(--edge-hi)}
.queue{margin-left:auto;display:flex;align-items:stretch;border-left:2px solid var(--black);transition:transform 70ms linear}
.queue:hover{transform:translateY(1px)}
.queue .ql{display:flex;align-items:center;padding:0 12px;font:700 10px var(--mono);letter-spacing:.14em;background:var(--tile);background-image:var(--knurl);color:var(--ink)}
.queue .qn{display:flex;align-items:center;padding:0 10px;font:700 10px var(--mono);letter-spacing:.08em;border-left:1px solid var(--black);color:var(--ink2)}
.queue .qn.need{background:var(--amber);color:var(--black)}
.queue .qn.dim{color:var(--ink3)}
.queue.on .ql{background:var(--edge-hi);color:var(--black)}
.ws-tabs .cmd{display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--ink3);font:11px var(--mono)}
.ws-tabs .cmd kbd{border:1px solid var(--edge);padding:1px 5px;color:var(--ink2)}

/* the franchise plate: one line, every number earns its place */
.plate{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;padding:10px 20px;border-bottom:2px solid var(--black)}
.who b{font-size:20px;letter-spacing:-.01em}
.who div{font:11px var(--mono);color:var(--ink2);margin-top:3px}
.cap{display:grid;gap:6px}
.cap-top{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--ink3);letter-spacing:.08em}
.cap-top b{color:var(--ink);font-weight:600}
.cap-bar{display:flex;height:12px;border:1px solid var(--edge);background:var(--sunken)}
.cap-bar span{height:100%;border-right:2px solid var(--black)}
.seg-c{background:var(--edge-hi)} .seg-d{background:var(--hatch),var(--ink3)} .seg-r{background:transparent}
.cap-key{display:flex;gap:16px;font:11px var(--mono);color:var(--ink2)}
.cap-key i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px;border:1px solid var(--edge)}
.check{border:2px solid var(--edge-hi);padding:8px 12px;display:grid;gap:2px;min-width:190px}
.check .h{font:700 10px var(--mono);letter-spacing:.14em;color:var(--ink3)}
.check .v{font-weight:600}
.check .v .warn{color:var(--amber)}
.check .t{font:11px var(--mono);color:var(--amber)}

/* main board: starters | bench, both fixed-height */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(430px,32%);gap:0;min-height:0;border-bottom:2px solid var(--black)}
.col{display:flex;flex-direction:column;min-height:0;border-right:2px solid var(--black)}
.col:last-child{border-right:0}
.sec{display:flex;justify-content:space-between;padding:7px 14px 5px;font:700 10px var(--mono);letter-spacing:.14em;color:var(--ink3);background:var(--sunken);border-bottom:1px solid var(--edge)}
.sec span{font-weight:400}
.ch{display:flex;align-items:baseline;justify-content:space-between;padding:10px 14px 8px;border-bottom:1px solid var(--edge)}
.ch b{font:700 11px var(--mono);letter-spacing:.14em}
.ch span{font:11px var(--mono);color:var(--ink3)}
.slots{flex:none}
.mu{flex:1;min-height:0;overflow:hidden;border-top:2px solid var(--black);display:flex;flex-direction:column}
.mu-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px;gap:14px;border-bottom:1px solid var(--edge)}
.mu-h .side b{display:block;font:700 22px var(--mono)}
.mu-h .side span{font:11px var(--mono);color:var(--ink3)}
.mu-h .them{text-align:right}
.wp{width:260px;display:grid;gap:4px;text-align:center;font:11px var(--mono);color:var(--ink2)}
.wp .bar{display:flex;height:10px;border:1px solid var(--edge)}
.wp .bar i{background:var(--edge-hi)}
.mu-rows{display:grid;grid-template-columns:1fr 1fr;align-content:start}
.mu-rows div{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;padding:0 14px;height:28px;align-items:center;border-bottom:1px solid var(--rule);font-size:12px}
.mu-rows div:nth-child(odd){border-right:1px solid var(--rule)}
.mu-rows .n{text-align:right}
.slot{display:grid;grid-template-columns:52px 34px 230px 150px 64px 52px 44px 1fr;align-items:center;gap:8px;height:30px;
  padding:0 14px;border-bottom:1px solid var(--rule);transition:transform 70ms linear;cursor:pointer}
.slot:hover{background:var(--raised);transform:translateX(2px)}
.slot .sl{font:600 10px var(--mono);letter-spacing:.06em;color:var(--ink3)}
.slot .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .nm small{color:var(--ink3);font:11px var(--mono);margin-left:6px}
.slot .pr{font-family:var(--mono);text-align:right}
.slot .st{font:600 10px var(--mono);text-align:right}
.st.bye{color:var(--ink3)} .st.q{color:var(--amber)} .st.out{color:var(--red)} .st.live{color:var(--blue)}
.form{position:relative;display:flex;gap:2px;align-items:flex-end;height:22px;justify-self:start;border-bottom:1px solid var(--edge)}
.form i{width:10px;background:hsl(220,9%,30%);transition:transform 70ms linear}
.form i.up{background:hsl(220,10%,62%)}
.form i.bye{height:100%!important;background:repeating-linear-gradient(-45deg,hsl(220,9%,34%) 0 2px,transparent 2px 5px)}
.form .pj{position:absolute;left:0;width:58px;height:0;border-top:1px dashed hsl(220,8%,50%);pointer-events:none}
.form b{font:10px var(--mono);color:var(--ink2);margin-left:8px;align-self:center;font-weight:400}
.form i:hover{transform:scaleY(1.08);outline:1px solid var(--edge-hi)}
.blist .form i{width:9px}.blist .form .pj{width:53px}.blist .form b{display:none}
.form em{font:10px var(--mono);color:var(--ink3);font-style:normal;margin-right:6px;align-self:center}
@container (max-width:640px){.board .col:first-child .form{display:none}}
.board .col:first-child{container-type:inline-size}
.slot.gap{background:repeating-linear-gradient(-45deg,hsla(220,8%,82%,.22) 0 6px,hsla(220,25%,2%,.6) 6px 12px);outline:2px solid var(--edge-hi);outline-offset:-2px;box-shadow:inset 6px 0 0 var(--amber)}
.slot.gap .sl{color:var(--ink);padding-left:4px}
.slot.gap .st{background:var(--amber);color:var(--black);text-align:center;padding:2px 0;font-weight:700}
.slot.gap .nm{color:var(--ink);font-weight:600;background:var(--black);padding:2px 8px;justify-self:start}
.slot.target{outline:1px dashed var(--edge-hi);outline-offset:-3px}
.drag{cursor:grab;touch-action:none;transition:transform 70ms linear,box-shadow 70ms linear}
.drag:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--black);border-color:var(--edge-hi);color:var(--ink)}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;background:var(--edge-hi);color:var(--black);border-color:var(--edge-hi);box-shadow:3px 3px 0 var(--black);padding:2px 8px}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
.slot.over{background:var(--raised);outline:2px solid var(--edge-hi);outline-offset:-2px}
.bench.dropzone .blist{outline:2px dashed var(--edge-hi);outline-offset:-4px}
.slot.chg{box-shadow:inset 4px 0 0 var(--edge-hi);background:var(--raised)}
.slot.picked{background:var(--raised);box-shadow:inset 4px 0 0 var(--edge-hi)}

.bench .filters{display:flex;gap:3px;padding:8px 14px;border-bottom:1px solid var(--edge)}
.chip{font:600 10px var(--mono);padding:2px 0;flex:1;text-align:center;border:1px solid var(--edge);color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--edge-hi);color:var(--black);border-color:var(--edge-hi)}
.blist{flex:none;max-height:calc(30px * 22);overflow:auto}
.inl{flex:1;min-height:0;overflow:hidden}
.inl .sec{border-top:2px solid var(--black)}
.inl .slot{height:30px;grid-template-columns:34px minmax(150px,1fr) 64px 52px}
.blist .slot{height:30px;grid-template-columns:34px minmax(130px,190px) 96px 58px 44px 1fr}
.blist::-webkit-scrollbar{width:8px} .blist::-webkit-scrollbar-thumb{background:var(--edge)}

/* action tray: the only home for commit controls */
.tray{display:flex;align-items:center;gap:10px;padding:10px 20px;white-space:nowrap;background:var(--sunken)}
.tray .msg{font:12px var(--mono);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;margin-left:8px}
.tray .sp{margin-left:auto}

/* pull tabs: physical handles on the bottom edge */
.pulls{display:flex;gap:6px;align-self:stretch;margin:-10px 0}
.pull{display:flex;gap:8px;align-items:center;padding:0 12px;background:var(--tile);background-image:var(--knurl);
  border:2px solid var(--edge);border-top:0;font:600 10px var(--mono);letter-spacing:.1em;color:var(--ink2);
  transform:translateY(-3px);transition:transform 70ms linear}
.pull:hover{transform:translateY(0);color:var(--ink);border-color:var(--edge-hi)}
.pull b{color:var(--ink);font-weight:700}
.pull[aria-expanded=true]{transform:translateY(0);border-color:var(--edge-hi);color:var(--ink)}

/* bottom drawer */
.bdrawer{position:absolute;left:0;right:0;bottom:var(--trayh,52px);max-height:60%;background:var(--tile);border-top:3px solid var(--edge-hi);
  transform:translateY(102%);transition:transform 120ms ease-out;z-index:6;display:grid;grid-template-rows:auto 1fr}
.bdrawer::before{content:"";position:absolute;left:0;right:0;top:-3px;height:5px;background:var(--hazard)}
.bdrawer:not(.open){transform:translateY(calc(100% + var(--trayh,52px) + 8px));visibility:hidden;transition:transform 120ms ease-out,visibility 0s 120ms}
.bdrawer.open{transform:none;visibility:visible}
.bd-head{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:2px solid var(--black)}
.bd-head h2{font-size:15px}
.bd-head .sub{font:11px var(--mono);color:var(--ink3)}
.bd-head .x{margin-left:auto;font:11px var(--mono);border:1px solid var(--edge);padding:2px 6px;color:var(--ink3)}
.bd-body{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0;overflow:hidden}
.bd-main{min-width:0;border-right:2px solid var(--black)}
.bd-side{display:flex;flex-direction:column}
.bd-side .ch{border-top:0}
.sum{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--black)}
.sum div{padding:10px 14px;border-right:1px solid var(--rule)}
.sum div:nth-child(2n){border-right:0}
.sum div:nth-child(n+3){border-top:1px solid var(--rule)}
.sum b{display:block;font:700 18px var(--mono)} .sum span{font:10px var(--mono);letter-spacing:.08em;color:var(--ink3)}
.bt td{height:30px}
.bt .btn{padding:2px 8px;font-size:10px}
.yrs{display:inline-flex;gap:2px;vertical-align:-1px}.yrs i{width:10px;height:10px;border:1px solid var(--ink3)}.yrs i.u{background:var(--edge-hi);border-color:var(--edge-hi)}
.tl{display:grid;grid-template-columns:repeat(9,1fr);margin:12px 14px 14px;border:1px solid var(--edge)}
.tl div{height:54px;border-right:1px solid var(--rule);padding:4px 6px;font:10px var(--mono);color:var(--ink3);position:relative}
.tl div:last-child{border-right:0}
.tl div.now{background:var(--raised);color:var(--ink)}
.tl b{position:absolute;left:4px;right:4px;bottom:5px;font:600 10px var(--mono);color:var(--black);background:var(--edge-hi);padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi{display:grid;grid-template-columns:22px 52px 1fr auto;gap:10px;align-items:center;padding:0 14px;height:34px;border-bottom:1px solid var(--rule);cursor:pointer;transition:transform 70ms linear}
.wi:hover{background:var(--raised);transform:translateX(2px)}
.wi .box{width:14px;height:14px;border:2px solid var(--edge)}
.wi.on{background:var(--raised)} .wi.on .box{background:var(--edge-hi);border-color:var(--edge-hi)}
.wi .k{font:600 10px var(--mono);letter-spacing:.08em;color:var(--ink3)}
.wi .d{font:12px var(--mono)}
.sum .delta .ok{color:var(--green)}.sum .delta .warn{color:var(--amber)}
.sum .delta span{font:inherit}
.sum .delta{display:block;padding:0;border:0;font:11px var(--mono);color:var(--ink3);margin-top:2px}

.elig{font:10px var(--mono);color:var(--ink3);text-align:right}

/* ---------- inspector + custom drawers ---------- */
.insp{background:var(--tile);border-left:3px solid var(--black);display:grid;grid-template-rows:auto auto 1fr auto auto;min-height:0}
.ihead{padding:14px 16px 12px;border-bottom:2px solid var(--black)}
.ihead .top{display:flex;justify-content:space-between;align-items:center}
.ihead .on{font:600 11px var(--mono);color:var(--blue)}
.ihead .nm{font-size:17px;font-weight:700;margin-top:6px}
.ihead .sub{color:var(--ink2);font-size:12px;margin-top:2px}
.nums{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--black)}
.nums div{padding:12px 16px}
.nums div+div{border-left:1px solid var(--edge)}
.nums b{display:block;font:700 26px var(--mono)}
.nums span{font:11px var(--mono);color:var(--ink3)}
.idrawers{overflow:hidden;min-height:0}
.idr{border-bottom:1px solid var(--black)}
.idr>button{width:100%;display:flex;align-items:center;gap:8px;padding:9px 16px;font:600 11px var(--mono);letter-spacing:.08em;color:var(--ink2);text-align:left;transition:transform 70ms linear}
.idr>button:hover{color:var(--ink);transform:translateX(2px)}
.idr>button .c{margin-left:auto;color:var(--ink3)}
.idr.open>button{color:var(--ink);background:var(--raised);box-shadow:inset 3px 0 0 var(--edge-hi)}
.idr .body{display:none;padding:10px 16px 12px;background:var(--canvas)}
.idr.open .body{display:block}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--rule);font-size:12px}
.kv span:last-child{font-family:var(--mono)}
.mine{font:9px var(--mono);letter-spacing:.1em;border:1px solid var(--edge);padding:0 4px;color:var(--ink3)}
.arc{display:flex;align-items:flex-end;gap:3px;height:46px;margin-top:4px}
.arc i{flex:1;background:var(--ink3)} .arc i.now{background:var(--edge-hi)}
.iact{border-top:2px solid var(--black);padding:12px 16px;display:grid;gap:8px}
.iact .h{font:700 10px var(--mono);letter-spacing:.14em;color:var(--ink3)}
.ia{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ifoot{border-top:2px solid var(--black);padding:10px 16px;display:flex;justify-content:space-between;font:11px var(--mono);color:var(--ink3)}
.ifoot button{color:var(--ink2);border:1px dashed var(--edge);padding:3px 8px}
.ok{color:var(--green)} .warn{color:var(--amber)}

/* ---------- v7: workspaces, cap, moves, release, customize ---------- */
.ws{display:none}.ws.on{display:grid}
.work{grid-template-rows:auto auto 1fr auto}
.capws{grid-template-columns:minmax(0,1fr) minmax(430px,32%);min-height:0;border-bottom:2px solid var(--black)}
.ctable{display:flex;flex-direction:column;min-height:0;border-right:2px solid var(--black)}
.ct-wrap{flex:1;min-height:0;overflow:auto}
.ct{width:100%;border-collapse:collapse}
.ct th{position:sticky;top:0;z-index:1;background:var(--sunken);text-align:right;font:600 10px var(--mono);letter-spacing:.12em;color:var(--ink3);padding:7px 10px;border-bottom:2px solid var(--black);white-space:nowrap}
.ct th:nth-child(-n+2){text-align:left}
.ct th.sorted{color:var(--ink)}
.ct td{height:30px;padding:0 10px;border-bottom:1px solid var(--rule);text-align:right;font-family:var(--mono);font-size:12px;white-space:nowrap}
.ct td:nth-child(2){text-align:left;font-family:var(--sans);font-size:13px}
.ct td:first-child{text-align:left;width:44px}
.ct td.off{color:var(--edge)}
.ct td.yr{background:hsla(220,8%,82%,.035);border-left:1px solid var(--rule)}
.ct td.last{position:relative;padding-right:18px}
:root{--rfa:hsl(84,90%,52%);--ufa:hsl(54,100%,54%)}
.cap-end{position:absolute;right:3px;top:5px;bottom:5px;width:9px;border:1px solid var(--black)}
.cap-end,.key-cap{background-image:repeating-linear-gradient(45deg,hsla(220,25%,2%,.55) 0 1px,transparent 1px 3px),repeating-linear-gradient(-45deg,hsla(220,25%,2%,.35) 0 1px,transparent 1px 3px)}
.cap-end.rfa,.key-cap.rfa{background-color:var(--rfa)} .cap-end.ufa,.key-cap.ufa{background-color:var(--ufa)}
.key-cap{display:inline-block;width:9px;height:13px;border:1px solid var(--black);vertical-align:-2px;margin:0 5px 0 12px}
.fa{font:700 10px var(--mono);letter-spacing:.08em;padding:1px 5px;color:var(--black);border:1px solid var(--black)}
.fa.rfa{background:var(--rfa)} .fa.ufa{background:var(--ufa)}
.ct tr{transition:transform 70ms linear;cursor:pointer}
.ct tbody tr:hover{background:var(--raised);transform:translateX(2px)}

 <div class="pv"><b>Affects ${s.h.length} ${s.h.length===1?"person":"people"}</b>${s.h.length?": "+s.h.join(", "):""}. ${a.length?'<span class="warn">Adds powers.</span> ':""}${a.some(c=>CONLY.has(c))?'<span class="warn">Includes commissioner-only actions: typed reason required.</span> ':""}Actions already started under the old version finish under it. Grants are private.</div>
 <div class="f" style="align-self:flex-end;gap:6px"><button class="cr-btn pri" data-psave>SAVE NEW VERSION</button><button class="cr-btn" data-pdiscard>DISCARD</button></div>`)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;if(t.dataset.psave!==undefined){e.stopPropagation();const s=PSETS[PERMSEL];PDRAFT.add.forEach(c=>s.c.push(c));s.c=s.c.filter(c=>!PDRAFT.rem.has(c));s.v=(s.v||1)+1;PDRAFT={add:new Set(),rem:new Set()};closeEd();VIEWS.people();toast("MOCK · would record (private): "+s.n+" version "+s.v)}
 if(t.dataset.pdiscard!==undefined){e.stopPropagation();PDRAFT={add:new Set(),rem:new Set()};closeEd();VIEWS.people()}},true);
document.addEventListener("change",e=>{if(e.target.dataset.pc){const s=PSETS[PERMSEL],c=e.target.dataset.pc,had=s.c.includes(c);if(e.target.checked){had?PDRAFT.rem.delete(c):PDRAFT.add.add(c)}else{had?PDRAFT.rem.add(c):PDRAFT.add.delete(c)}stageBar()}if(e.target.id==="pwho")whoIs(e.target.value)});
document.addEventListener("input",e=>{if(e.target.id==="pwhat")whoCan(e.target.value)});
// ---------- wiring ----------
const CMDS={"cap.amount":v=>{go("rules");pickRule("cap.amount");editRule("cap.amount");return "opened Salary cap with "+v},"pick.grant":()=>{go("picks");pickAct(0);return "opened Create and grant a pick"},
 "waivers.process":()=>{go("season");return "Waivers: confirm on the Season desk"},"help":()=>"Try: cap.amount 130M · pick.grant · waivers.process · find owner left"};
document.addEventListener("click",e=>{const t=e.target.closest("button,[data-job],[data-rule],[data-pick],[data-team],[data-win],.cr-scrim");if(!t)return;const d=t.dataset;
 if(t.id==="scrim"||d.close!==undefined)return closeCard();
 if(d.tab)return go(d.tab);
 if(d.hit!==undefined){const h=$("#res")._hits[+d.hit];$("#res").classList.remove("open");$("#find").value="";return h[3]()}
 if(d.job)return openJob(d.job);
 if(d.jobopen)return openJob(d.jobopen);
 if(d.launch){const m={stat:()=>openJob("stat"),trade:()=>openJob("trade"),waivers:()=>go("season"),notice:()=>go("league"),invite:()=>go("people"),pick:()=>go("picks"),fix:()=>go("fix"),rule:()=>{go("rules");$("#find").focus()}};return m[d.launch]()}
 if(d.sitcat){SITCAT=d.sitcat;return VIEWS.sit()}
 if(d.sit!==undefined)return openSit(+d.sit);
 if(d.step){closeCard();const s=d.step;if(s.includes("›")){const b=s.split("›")[0].trim().toLowerCase();const k={rules:"rules",server:"server",people:"people",jobs:"jobs"}[b];if(k)return go(k)}
  const r=RULES.find(x=>s.includes(x[2]));if(r){go("rules");return pickRule(r[2])}const fi=FIXES.findIndex(f=>s.startsWith(f[2]));if(fi>=0){go("fix");return openFix(fi)}
  if(s.startsWith("trade")){go("jobs");return openJob("trade")}if(s.startsWith("pick")||s==="correct.pick"){go("picks");return pickAct(1)}if(s.startsWith("draft")||s.startsWith("waivers")||s.startsWith("bids")||s.startsWith("bracket")||s.startsWith("calendar"))return go("season");
  if(s.includes("seat")||s.includes("succession")||s.includes("vote"))return go("people");if(s.includes("notice"))return go("league");if(s.includes("stats.queue")||s.includes("stat.queue"))return statCard();return go("fix")}
 if(d.fam){FAMSEL=d.fam;PAGE=0;SELRULE=null;return VIEWS.rules()}
 if(d.page){const n=+d.page;PAGE=Math.max(0,PAGE+n);return VIEWS.rules()}
 if(d.rule)return pickRule(d.rule);
 if(d.edit)return editRule(d.edit);
 if(d.pend){const r=RULES.find(x=>x[2]===d.pend);const now=$("#ed [data-seg] button:nth-child(2)").getAttribute("aria-pressed")==="true";if(!now&&!PENDING.includes(d.pend))PENDING.push(d.pend);record("commish.rules.set field="+d.pend,(now?"Changed now: ":"Pending next rollover: ")+r[3]);return VIEWS.rules()}
 if(t.parentElement&&t.parentElement.dataset.seg!==undefined){[...t.parentElement.children].forEach(b=>b.setAttribute("aria-pressed",b===t));return}
 if(d.x!==undefined)return closeEd();
 if(d.fire)return record(d.fire,d.done);
 if(d.fix!==undefined)return openFix(+d.fix);
 if(d.go){closeCard();return go(d.go)}
 if(d.pickact!==undefined){if(TAB!=="picks")go("picks");return pickAct(+d.pickact)}
 if(d.pick)return pickHist(d.pick);
 if(d.pks){PKSEASON=+d.pks;PKPAGE=0;return VIEWS.picks()}
 if(d.pkpage){PKPAGE=Math.max(0,PKPAGE+ +d.pkpage);return VIEWS.picks()}
 if(d.team)return pickTeam(d.team);
 if(d.win){openEd(`<div class="f"><label>WINDOW</label><b>${d.win}</b></div><div class="f"><label>OPENS</label><input value="May 3" style="width:100px"></div><div class="f"><label>CLOSES</label><input value="May 10" style="width:100px"></div><div class="f"><label>WHAT IT OPENS</label><input value="UFA bids" style="width:160px"></div><div class="pv"><b>Preview</b> · moves for all owners; reminders follow the new dates.</div><div class="f" style="align-self:flex-end;gap:6px">${holdBtn("MOVE","calendar.window.move id="+d.win,"Window moved: "+d.win)}<button class="cr-btn" data-x>CANCEL</button></div>`);return}
 if(d.act){const c=d.act;if(ROLE!=="C"&&(LOCKED.has(c.split(" ")[0])||CONLY.has(c.split(" ")[0])||/role\.|deputy|standings\.override|rollover|engine/.test(c)))return toast("Commissioner only: the co-commissioner cannot do this.");if(c==="feedgo")return go("server");if(c==="perm"){PEOPLEMODE="perm";return VIEWS.people()}if(c==="draft")return toast("Opens the Draft room with the commissioner tray");if(c==="agent")return openCard("Connect an AI agent","Ruled 10-24 · the wizard is not built yet",`<div class="cr-steps"><div><span class="no">1</span><span>Pick the job: missing-owner team · support · command-line helper</span><span></span></div><div><span class="no">2</span><span>Scope and expiry (e.g. Comets only, 30 days)</span><span></span></div><div><span class="no">3</span><span>Pick the tool (Claude Code, Codex, pi): get a token and setup to copy</span><span></span></div><div><span class="no">4</span><span>Status: last used, actions taken, revoke</span><span></span></div></div><div class="cr-note">The agent acts for you; anything big still asks you to confirm, and the ledger says “via AI”.</div>`);
  const g3=/remove|replace|rollover$|revert|restore|upgrade|override/.test(c);
  openEd(`<div class="f"><label>ACTION</label><b>${d.lbl}</b><span class="sub mono">${c}</span></div><div class="f" style="width:300px"><label>${g3?"REASON (REQUIRED)":"NOTE (OPTIONAL)"}</label><textarea></textarea></div><div class="pv"><b>Preview</b> · shows who this touches before anything changes.${/not built|NOT BUILT/.test(d.lbl)||/totp|support|operator/.test(c)?'<br><span class="warn">Ruled, not built yet.</span>':""}</div><div class="f" style="align-self:flex-end;gap:6px">${g3?holdBtn("CONFIRM",c,d.lbl+" recorded"):confirmBtn("CONFIRM",c,d.lbl+" recorded")}<button class="cr-btn" data-x>CANCEL</button></div>`);return}
 if(t.id==="rolesw"){ROLE=ROLE==="C"?"CC":"C";$("#whoami").textContent="Signed in: "+(ROLE==="C"?"Commissioner":"Co-commissioner");t.textContent=ROLE==="C"?"VIEW AS CO-COMMISH":"VIEW AS COMMISH";return go(TAB)}
});
// hold to fire
document.addEventListener("pointerdown",e=>{const h=e.target.closest(".cr-hold");if(!h)return;h.classList.add("go");h._t=setTimeout(()=>{h.classList.remove("go");record(h.dataset.hold,h.dataset.done)},600)});
["pointerup","pointerleave"].forEach(ev=>document.addEventListener(ev,e=>{document.querySelectorAll(".cr-hold.go").forEach(h=>{clearTimeout(h._t);h.classList.remove("go")})},true));
document.addEventListener("change",e=>{if(e.target.id==="pkteam"){PKTEAM=e.target.value;PKPAGE=0;VIEWS.picks()}});
$("#find").addEventListener("input",e=>runSearch(e.target.value));
$("#find").addEventListener("keydown",e=>{if(e.key==="Enter"){const h=$("#res")._hits;if(h&&h[0]){$("#res").classList.remove("open");e.target.value="";h[0][3]()}}if(e.key==="Escape"){$("#res").classList.remove("open");e.target.blur()}});
$("#cmd").addEventListener("keydown",e=>{if(e.key!=="Enter")return;const v=e.target.value.trim(),[k,...a]=v.split(/\s+/);const f=CMDS[k];
 if(f)$("#cmdout").textContent="› "+f(a.join(" "));else if(k==="find"){$("#find").value=a.join(" ");runSearch(a.join(" "));$("#find").focus()}else $("#cmdout").textContent="Not a command. Type help.";e.target.value=""});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("[data-job],[data-rule],[data-pick],[data-team]")){e.target.click();return}if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#find").focus()}if(e.key==="Escape"){closeCard();closeEd()}});
go("jobs");
</script></body></html>
