<!doctype html><html lang="en"><head><meta charset="utf-8"><title>TheWarRoom · Home mock v1</title><style>
:root{
  --canvas:hsl(220,20%,6%); --sunken:hsl(220,22%,4%); --tile:hsl(220,18%,9%); --raised:hsl(220,18%,12%);
  --ink:hsl(220,20%,94%); --ink2:hsl(220,12%,74%); --ink3:hsl(220,10%,56%);
  --edge:hsl(220,10%,28%); --edge-hi:hsl(220,8%,82%); --black:hsl(220,25%,2%); --rule:hsl(220,15%,13%);
  --green:hsl(145,50%,58%); --blue:hsl(210,80%,66%); --amber:hsl(38,92%,58%); --red:hsl(358,75%,62%);
  --mono:"JetBrains Mono","DejaVu Sans Mono",monospace; --sans:"Inter","Noto Sans",system-ui,sans-serif;
  --knurl:repeating-linear-gradient(45deg,hsla(0,0%,100%,.035) 0 1px,transparent 1px 4px),
          repeating-linear-gradient(-45deg,hsla(0,0%,0%,.35) 0 1px,transparent 1px 4px);
  --hazard:repeating-linear-gradient(-45deg,var(--edge-hi) 0 6px,var(--black) 6px 12px);
  --hatch:repeating-linear-gradient(-45deg,hsla(220,8%,82%,.10) 0 5px,transparent 5px 10px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--canvas);color:var(--ink);font:13px/1.35 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono,.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:224px 1fr 316px;height:100%}

/* ---------- rail (option 3, ruled) ---------- */
.rail{background:var(--tile);background-image:var(--knurl);border-right:3px solid var(--black);display:flex;flex-direction:column}
.rail-head{padding:14px 14px 12px;border-bottom:2px solid var(--black)}
.lg{font:700 12px var(--mono);letter-spacing:.16em}
.ph{margin-top:6px;font:11px var(--mono);color:var(--ink2)} .ph i{font-style:normal;color:var(--green)}
.rail-body{flex:1;padding:6px 0;overflow:hidden}
.gl{padding:10px 14px 4px;font:600 10px var(--mono);letter-spacing:.16em;color:var(--ink3)}
.node>.nb{width:100%;display:flex;align-items:center;gap:10px;padding:8px 14px;text-align:left;font-weight:600;border-left:4px solid transparent;transition:transform 70ms linear}
.nb .k{font:11px var(--mono);color:var(--ink3);width:10px}
.nb .car{margin-left:auto;font:11px var(--mono);color:var(--ink3)}
.nb:hover{transform:translateX(2px);background:var(--raised)}
.node.open>.nb{background:var(--raised);border-image:var(--hazard) 1}
.node.open .car{transform:rotate(90deg)}
.mark{width:6px;height:6px;background:var(--green);margin-left:4px}
.leaf{display:flex;gap:6px;width:100%;padding:5px 14px 5px 26px;text-align:left;color:var(--ink2);font-size:12.5px;transition:transform 70ms linear}
.leaf:hover{color:var(--ink);transform:translateX(2px)}
.leaf .tr{font-family:var(--mono);color:var(--edge)}
.leaf.sel{color:var(--ink);font-weight:600} .leaf.sel .tr::after{content:"▮";color:var(--edge-hi)}
.leaf.now{border:1px solid var(--edge);margin:2px 10px 4px 22px;width:calc(100% - 32px);padding-left:8px;color:var(--ink)}
.tag{font:700 9px var(--mono);letter-spacing:.12em;background:var(--edge-hi);color:var(--black);padding:1px 4px;align-self:center}
.rail-foot{border-top:2px solid var(--black);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font:11px var(--mono);color:var(--ink3)}

/* ---------- shared controls ---------- */
.btn{border:2px solid var(--edge);padding:6px 11px;font:600 11px var(--mono);letter-spacing:.06em;transition:transform 70ms linear,box-shadow 70ms linear}
.btn:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--black);border-color:var(--edge-hi)}
.btn:active{transform:none;box-shadow:none}
.btn.g2{border-width:2px;border-color:var(--edge-hi)}
.btn.solid{background:var(--edge-hi);color:var(--black);border-color:var(--edge-hi)}
.pg{display:inline-block;min-width:26px;text-align:center;border:1px solid var(--ink3);font:600 10px var(--mono);padding:0 3px;color:var(--ink2)}

/* ---------- workspace ---------- */
.work{position:relative;display:grid;grid-template-rows:auto auto 1fr auto;min-width:0;overflow:hidden}
.ws-tabs{display:flex;align-items:stretch;border-bottom:2px solid var(--black);background:var(--sunken)}
.ws-tabs button{padding:11px 16px;font:600 11px var(--mono);letter-spacing:.1em;color:var(--ink3);border-right:1px solid var(--black)}
.ws-tabs button[aria-selected=true]{color:var(--ink);background:var(--canvas);box-shadow:inset 0 3px 0 var(--edge-hi)}
.queue{margin-left:auto;display:flex;align-items:stretch;border-left:2px solid var(--black);transition:transform 70ms linear}
.queue:hover{transform:translateY(1px)}
.queue .ql{display:flex;align-items:center;padding:0 12px;font:700 10px var(--mono);letter-spacing:.14em;background:var(--tile);background-image:var(--knurl);color:var(--ink)}
.queue .qn{display:flex;align-items:center;padding:0 10px;font:700 10px var(--mono);letter-spacing:.08em;border-left:1px solid var(--black);color:var(--ink2)}
.queue .qn.need{background:var(--amber);color:var(--black)}
.queue .qn.dim{color:var(--ink3)}
.queue.on .ql{background:var(--edge-hi);color:var(--black)}
.ws-tabs .cmd{display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--ink3);font:11px var(--mono)}
.ws-tabs .cmd kbd{border:1px solid var(--edge);padding:1px 5px;color:var(--ink2)}

/* the franchise plate: one line, every number earns its place */
.plate{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;padding:10px 20px;border-bottom:2px solid var(--black)}
.who b{font-size:20px;letter-spacing:-.01em}
.who div{font:11px var(--mono);color:var(--ink2);margin-top:3px}
.cap{display:grid;gap:6px}
.cap-top{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--ink3);letter-spacing:.08em}
.cap-top b{color:var(--ink);font-weight:600}
.cap-bar{display:flex;height:12px;border:1px solid var(--edge);background:var(--sunken)}
.cap-bar span{height:100%;border-right:2px solid var(--black)}
.seg-c{background:var(--edge-hi)} .seg-d{background:var(--hatch),var(--ink3)} .seg-r{background:transparent}
.cap-key{display:flex;gap:16px;font:11px var(--mono);color:var(--ink2)}
.cap-key i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px;border:1px solid var(--edge)}
.check{border:2px solid var(--edge-hi);padding:8px 12px;display:grid;gap:2px;min-width:190px}
.check .h{font:700 10px var(--mono);letter-spacing:.14em;color:var(--ink3)}
.check .v{font-weight:600}
.check .v .warn{color:var(--amber)}
.check .t{font:11px var(--mono);color:var(--amber)}

/* main board: starters | bench, both fixed-height */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(430px,32%);gap:0;min-height:0;border-bottom:2px solid var(--black)}
.col{display:flex;flex-direction:column;min-height:0;border-right:2px solid var(--black)}
.col:last-child{border-right:0}
.sec{display:flex;justify-content:space-between;padding:7px 14px 5px;font:700 10px var(--mono);letter-spacing:.14em;color:var(--ink3);background:var(--sunken);border-bottom:1px solid var(--edge)}
.sec span{font-weight:400}
.ch{display:flex;align-items:baseline;justify-content:space-between;padding:10px 14px 8px;border-bottom:1px solid var(--edge)}
.ch b{font:700 11px var(--mono);letter-spacing:.14em}
.ch span{font:11px var(--mono);color:var(--ink3)}
.slots{flex:none}
.mu{flex:1;min-height:0;overflow:hidden;border-top:2px solid var(--black);display:flex;flex-direction:column}
.mu-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px;gap:14px;border-bottom:1px solid var(--edge)}
.mu-h .side b{display:block;font:700 22px var(--mono)}
.mu-h .side span{font:11px var(--mono);color:var(--ink3)}
.mu-h .them{text-align:right}
.wp{width:260px;display:grid;gap:4px;text-align:center;font:11px var(--mono);color:var(--ink2)}
.wp .bar{display:flex;height:10px;border:1px solid var(--edge)}
.wp .bar i{background:var(--edge-hi)}
.mu-rows{display:grid;grid-template-columns:1fr 1fr;align-content:start}
.mu-rows div{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;padding:0 14px;height:28px;align-items:center;border-bottom:1px solid var(--rule);font-size:12px}
.mu-rows div:nth-child(odd){border-right:1px solid var(--rule)}
.mu-rows .n{text-align:right}
.slot{display:grid;grid-template-columns:52px 34px 230px 150px 64px 52px 44px 1fr;align-items:center;gap:8px;height:30px;
  padding:0 14px;border-bottom:1px solid var(--rule);transition:transform 70ms linear;cursor:pointer}
.slot:hover{background:var(--raised);transform:translateX(2px)}
.slot .sl{font:600 10px var(--mono);letter-spacing:.06em;color:var(--ink3)}
.slot .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .nm small{color:var(--ink3);font:11px var(--mono);margin-left:6px}
.slot .pr{font-family:var(--mono);text-align:right}
.slot .st{font:600 10px var(--mono);text-align:right}
.st.bye{color:var(--ink3)} .st.q{color:var(--amber)} .st.out{color:var(--red)} .st.live{color:var(--blue)}
.form{position:relative;display:flex;gap:2px;align-items:flex-end;height:22px;justify-self:start;border-bottom:1px solid var(--edge)}
.form i{width:10px;background:hsl(220,9%,30%);transition:transform 70ms linear}
.form i.up{background:hsl(220,10%,62%)}
.form i.bye{height:100%!important;background:repeating-linear-gradient(-45deg,hsl(220,9%,34%) 0 2px,transparent 2px 5px)}
.form .pj{position:absolute;left:0;width:58px;height:0;border-top:1px dashed hsl(220,8%,50%);pointer-events:none}
.form b{font:10px var(--mono);color:var(--ink2);margin-left:8px;align-self:center;font-weight:400}
.form i:hover{transform:scaleY(1.08);outline:1px solid var(--edge-hi)}
.blist .form i{width:9px}.blist .form .pj{width:53px}.blist .form b{display:none}
.form em{font:10px var(--mono);color:var(--ink3);font-style:normal;margin-right:6px;align-self:center}
@container (max-width:640px){.board .col:first-child .form{display:none}}
.board .col:first-child{container-type:inline-size}
.slot.gap{background:repeating-linear-gradient(-45deg,hsla(220,8%,82%,.22) 0 6px,hsla(220,25%,2%,.6) 6px 12px);outline:2px solid var(--edge-hi);outline-offset:-2px;box-shadow:inset 6px 0 0 var(--amber)}
.slot.gap .sl{color:var(--ink);padding-left:4px}
.slot.gap .st{background:var(--amber);color:var(--black);text-align:center;padding:2px 0;font-weight:700}
.slot.gap .nm{color:var(--ink);font-weight:600;background:var(--black);padding:2px 8px;justify-self:start}
.slot.target{outline:1px dashed var(--edge-hi);outline-offset:-3px}
.drag{cursor:grab;touch-action:none;transition:transform 70ms linear,box-shadow 70ms linear}
.drag:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--black);border-color:var(--edge-hi);color:var(--ink)}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;background:var(--edge-hi);color:var(--black);border-color:var(--edge-hi);box-shadow:3px 3px 0 var(--black);padding:2px 8px}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
.slot.over{background:var(--raised);outline:2px solid var(--edge-hi);outline-offset:-2px}
.bench.dropzone .blist{outline:2px dashed var(--edge-hi);outline-offset:-4px}
.slot.chg{box-shadow:inset 4px 0 0 var(--edge-hi);background:var(--raised)}
.slot.picked{background:var(--raised);box-shadow:inset 4px 0 0 var(--edge-hi)}

.bench .filters{display:flex;gap:3px;padding:8px 14px;border-bottom:1px solid var(--edge)}
.chip{font:600 10px var(--mono);padding:2px 0;flex:1;text-align:center;border:1px solid var(--edge);color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--edge-hi);color:var(--black);border-color:var(--edge-hi)}
.blist{flex:none;max-height:calc(30px * 22);overflow:auto}
.inl{flex:1;min-height:0;overflow:hidden}
.inl .sec{border-top:2px solid var(--black)}
.inl .slot{height:30px;grid-template-columns:34px minmax(150px,1fr) 64px 52px}
.blist .slot{height:30px;grid-template-columns:34px minmax(130px,190px) 96px 58px 44px 1fr}
.blist::-webkit-scrollbar{width:8px} .blist::-webkit-scrollbar-thumb{background:var(--edge)}

/* action tray: the only home for commit controls */
.tray{display:flex;align-items:center;gap:10px;padding:10px 20px;white-space:nowrap;background:var(--sunken)}
.tray .msg{font:12px var(--mono);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;margin-left:8px}
.tray .sp{margin-left:auto}

/* pull tabs: physical handles on the bottom edge */
.pulls{display:flex;gap:6px;align-self:stretch;margin:-10px 0}
.pull{display:flex;gap:8px;align-items:center;padding:0 12px;background:var(--tile);background-image:var(--knurl);
  border:2px solid var(--edge);border-top:0;font:600 10px var(--mono);letter-spacing:.1em;color:var(--ink2);
  transform:translateY(-3px);transition:transform 70ms linear}
.pull:hover{transform:translateY(0);color:var(--ink);border-color:var(--edge-hi)}
.pull b{color:var(--ink);font-weight:700}
.pull[aria-expanded=true]{transform:translateY(0);border-color:var(--edge-hi);color:var(--ink)}

/* bottom drawer */
.bdrawer{position:absolute;left:0;right:0;bottom:var(--trayh,52px);max-height:60%;background:var(--tile);border-top:3px solid var(--edge-hi);
  transform:translateY(102%);transition:transform 120ms ease-out;z-index:6;display:grid;grid-template-rows:auto 1fr}
.bdrawer::before{content:"";position:absolute;left:0;right:0;top:-3px;height:5px;background:var(--hazard)}
.bdrawer:not(.open){transform:translateY(calc(100% + var(--trayh,52px) + 8px));visibility:hidden;transition:transform 120ms ease-out,visibility 0s 120ms}
.bdrawer.open{transform:none;visibility:visible}
.bd-head{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:2px solid var(--black)}
.bd-head h2{font-size:15px}
.bd-head .sub{font:11px var(--mono);color:var(--ink3)}
.bd-head .x{margin-left:auto;font:11px var(--mono);border:1px solid var(--edge);padding:2px 6px;color:var(--ink3)}
.bd-body{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0;overflow:hidden}
.bd-main{min-width:0;border-right:2px solid var(--black)}
.bd-side{display:flex;flex-direction:column}
.bd-side .ch{border-top:0}
.sum{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--black)}
.sum div{padding:10px 14px;border-right:1px solid var(--rule)}
.sum div:nth-child(2n){border-right:0}
.sum div:nth-child(n+3){border-top:1px solid var(--rule)}
.sum b{display:block;font:700 18px var(--mono)} .sum span{font:10px var(--mono);letter-spacing:.08em;color:var(--ink3)}
.bt td{height:30px}
.bt .btn{padding:2px 8px;font-size:10px}
.yrs{display:inline-flex;gap:2px;vertical-align:-1px}.yrs i{width:10px;height:10px;border:1px solid var(--ink3)}.yrs i.u{background:var(--edge-hi);border-color:var(--edge-hi)}
.tl{display:grid;grid-template-columns:repeat(9,1fr);margin:12px 14px 14px;border:1px solid var(--edge)}
.tl div{height:54px;border-right:1px solid var(--rule);padding:4px 6px;font:10px var(--mono);color:var(--ink3);position:relative}
.tl div:last-child{border-right:0}
.tl div.now{background:var(--raised);color:var(--ink)}
.tl b{position:absolute;left:4px;right:4px;bottom:5px;font:600 10px var(--mono);color:var(--black);background:var(--edge-hi);padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi{display:grid;grid-template-columns:22px 52px 1fr auto;gap:10px;align-items:center;padding:0 14px;height:34px;border-bottom:1px solid var(--rule);cursor:pointer;transition:transform 70ms linear}
.wi:hover{background:var(--raised);transform:translateX(2px)}
.wi .box{width:14px;height:14px;border:2px solid var(--edge)}
.wi.on{background:var(--raised)} .wi.on .box{background:var(--edge-hi);border-color:var(--edge-hi)}
.wi .k{font:600 10px var(--mono);letter-spacing:.08em;color:var(--ink3)}
.wi .d{font:12px var(--mono)}
.sum .delta .ok{color:var(--green)}.sum .delta .warn{color:var(--amber)}
.sum .delta span{font:inherit}
.sum .delta{display:block;padding:0;border:0;font:11px var(--mono);color:var(--ink3);margin-top:2px}

.elig{font:10px var(--mono);color:var(--ink3);text-align:right}

/* ---------- inspector + custom drawers ---------- */
.insp{background:var(--tile);border-left:3px solid var(--black);display:grid;grid-template-rows:auto auto 1fr auto auto;min-height:0}
.ihead{padding:14px 16px 12px;border-bottom:2px solid var(--black)}
.ihead .top{display:flex;justify-content:space-between;align-items:center}
.ihead .on{font:600 11px var(--mono);color:var(--blue)}
.ihead .nm{font-size:17px;font-weight:700;margin-top:6px}
.ihead .sub{color:var(--ink2);font-size:12px;margin-top:2px}
.nums{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--black)}
.nums div{padding:12px 16px}
.nums div+div{border-left:1px solid var(--edge)}
.nums b{display:block;font:700 26px var(--mono)}
.nums span{font:11px var(--mono);color:var(--ink3)}
.idrawers{overflow:hidden;min-height:0}
.idr{border-bottom:1px solid var(--black)}
.idr>button{width:100%;display:flex;align-items:center;gap:8px;padding:9px 16px;font:600 11px var(--mono);letter-spacing:.08em;color:var(--ink2);text-align:left;transition:transform 70ms linear}
.idr>button:hover{color:var(--ink);transform:translateX(2px)}
.idr>button .c{margin-left:auto;color:var(--ink3)}
.idr.open>button{color:var(--ink);background:var(--raised);box-shadow:inset 3px 0 0 var(--edge-hi)}
.idr .body{display:none;padding:10px 16px 12px;background:var(--canvas)}
.idr.open .body{display:block}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--rule);font-size:12px}
.kv span:last-child{font-family:var(--mono)}
.mine{font:9px var(--mono);letter-spacing:.1em;border:1px solid var(--edge);padding:0 4px;color:var(--ink3)}
.arc{display:flex;align-items:flex-end;gap:3px;height:46px;margin-top:4px}
.arc i{flex:1;background:var(--ink3)} .arc i.now{background:var(--edge-hi)}
.iact{border-top:2px solid var(--black);padding:12px 16px;display:grid;gap:8px}
.iact .h{font:700 10px var(--mono);letter-spacing:.14em;color:var(--ink3)}
.ia{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ifoot{border-top:2px solid var(--black);padding:10px 16px;display:flex;justify-content:space-between;font:11px var(--mono);color:var(--ink3)}
.ifoot button{color:var(--ink2);border:1px dashed var(--edge);padding:3px 8px}
.ok{color:var(--green)} .warn{color:var(--amber)}

/* ---------- v7: workspaces, cap, moves, release, customize ---------- */
.ws{display:none}.ws.on{display:grid}
.work{grid-template-rows:auto auto 1fr auto}
.capws{grid-template-columns:minmax(0,1fr) minmax(430px,32%);min-height:0;border-bottom:2px solid var(--black)}
.ctable{display:flex;flex-direction:column;min-height:0;border-right:2px solid var(--black)}
.ct-wrap{flex:1;min-height:0;overflow:auto}
.ct{width:100%;border-collapse:collapse}
.ct th{position:sticky;top:0;z-index:1;background:var(--sunken);text-align:right;font:600 10px var(--mono);letter-spacing:.12em;color:var(--ink3);padding:7px 10px;border-bottom:2px solid var(--black);white-space:nowrap}
.ct th:nth-child(-n+2){text-align:left}
.ct th.sorted{color:var(--ink)}
.ct td{height:30px;padding:0 10px;border-bottom:1px solid var(--rule);text-align:right;font-family:var(--mono);font-size:12px;white-space:nowrap}
.ct td:nth-child(2){text-align:left;font-family:var(--sans);font-size:13px}
.ct td:first-child{text-align:left;width:44px}
.ct td.off{color:var(--edge)}
.ct td.yr{background:hsla(220,8%,82%,.035);border-left:1px solid var(--rule)}
.ct td.last{position:relative;padding-right:18px}
:root{--rfa:hsl(84,90%,52%);--ufa:hsl(54,100%,54%)}
.cap-end{position:absolute;right:3px;top:5px;bottom:5px;width:9px;border:1px solid var(--black)}
.cap-end,.key-cap{background-image:repeating-linear-gradient(45deg,hsla(220,25%,2%,.55) 0 1px,transparent 1px 3px),repeating-linear-gradient(-45deg,hsla(220,25%,2%,.35) 0 1px,transparent 1px 3px)}
.cap-end.rfa,.key-cap.rfa{background-color:var(--rfa)} .cap-end.ufa,.key-cap.ufa{background-color:var(--ufa)}
.key-cap{display:inline-block;width:9px;height:13px;border:1px solid var(--black);vertical-align:-2px;margin:0 5px 0 12px}
.fa{font:700 10px var(--mono);letter-spacing:.08em;padding:1px 5px;color:var(--black);border:1px solid var(--black)}
.fa.rfa{background:var(--rfa)} .fa.ufa{background:var(--ufa)}
.ct tr{transition:transform 70ms linear;cursor:pointer}
.ct tbody tr:hover{background:var(--raised);transform:translateX(2px)}

const H={phase:"in",mode:"default",edit:false,alerts:"some",sel:null,pick:null,lay:null,over:[],snz:{},pins:{}};

// ---------- mock data (illustrative) ----------

const HEAD=[["HI","Gold Rush 188.4 · season high, wk 8"],["UPS","Mudcats (2-6) beat 7-1 Sentinels by 0.6"],["TRD","Ironclads ↔ Harbor Kings · 3 players, 2 picks"],
  ["STK","Sentinels 7-game win streak ends"],["REC","Baird 52 rec · league leader among WRs"],["CLN","Harbor Kings clinch nothing yet · 6-2"],

  ["Wed","IR","Tundra activate Moss"],["Wed","TAXI","Kodiaks stash L. Ferro"],["Tue","ADD","Sentinels add D. Hale (LB)"],["Tue","DROP","Gold Rush drop M. Ott (S)"],["Mon","TRADE","Tundra ↔ Sentinels: 2026 1st for Hayes"],["Mon","ADD","Owls add C. Reyes (S)"],["Mon","DROP","Pilots drop F. Gant (RB)"],["Sun","IR","Rams move Odom to IR"],["Sun","TAXI","Mudcats stash V. Lyle"]];
const DUO=[["J. Allen","QB",24.6,18.2,"B. Purdy"],["Kincaid","RB",0,11.4,"J. Cook"],["Baird","WR",19.8,9.6,"D. London"],["Pacheco","RB",12.1,14.0,"Hall"],
  ["A. Brown","WR",8.2,22.3,"Nacua"],["Kelce","TE",11.0,6.4,"LaPorta"],["Parsons","DL",9.0,7.5,"Hutchinson"],["F. Warner","LB",14.5,10.0,"Roquan"],
  ["Gardner","CB",6.0,4.5,"Surtain"],["Hamilton","S",8.5,5.5,"Winfield"],["Butker","K",7.0,9.0,"Aubrey"],["O-LINE","OL",4.8,3.9,"O-LINE"],["Lamb","WR",0,0,"Chase"],["Kittle","TE",0,0,"Andrews"],["Crosby","DL",0,0,"Garrett"],["Smith","LB",0,0,"Queen"]];
const MINI=[[4,"Harbor Kings","6-2",""],[5,"Gold Rush","5-3",""],[6,"Kodiaks","5-3","me"],[7,"Mudcats","4-4","cut"],[8,"Tundra","4-4",""],[9,"Sentinels","4-4",""],[10,"Pilots","3-5",""],[11,"Owls","3-5",""],[12,"Rams","2-6",""],[13,"Comets","2-6",""],[14,"Bisons","2-6",""],[15,"Foxes","1-7",""],[16,"Pilgrims","1-7",""]];
const RUN=[["10","@ Sentinels",44,1],["11","Owls",71,0],["12","@ Harbor K.",38,1],["13","Gold Rush",41,1],["14","Pilots",66,0]];
const PWR=[[1,"Sentinels",91],[2,"Harbor Kings",86],[3,"Gold Rush",80],[4,"Ironclads",77],[5,"Kodiaks",74],[6,"Mudcats",69],[7,"Tundra",63],[8,"Pilots",58],[9,"Owls",55],[10,"Rams",49],[11,"Comets",44],[12,"Bisons",41],[13,"Mudhens",38],[14,"Pilgrims",35],[15,"Foxes",31],[16,"Tundra B",27]];
const PICKS=[["2027 1.07","own · proj 7th","$2.1M slot"],["2027 2.02","from Rams","$1.1M slot"],["2027 2.07","own","$0.9M slot"],["2027 4.07","own","$0.5M slot"],["2028 1st","own","—"],["2028 2nd","own","—"],["2028 3rd","from Owls","—"],["2029 1st","own","—"],["2029 2nd","own","—"],["2029 3rd","to Mudcats","traded"],["2030 1st","own","—"],["2030 2nd","own","—"],["2030 3rd","own","—"],["2030 4th","own","—"]];
const BIDS=[["R. Okafor WR","$3.4M","PLACED · HIGH","hi"],["T. Grant RB","$1.8M","OUTBID","out"],["L. Shaw CB","$0.9M","PLACED · HIGH","hi"],["M. Diaz TE","$1.2M","DRAFT · NOT PLACED",""],["P. Ike LB","$0.6M","PLACED · HIGH","hi"]];
const PLAN=[[1,"Tag decision: Pacheco or let walk","Mar 4"],[0,"Shop Kelce before rookie draft","Mar 11"],[0,"Target 2 CB in FA (cap ≤ $6M)","Mar 20"],[0,"Trade up into top 5 if Ward falls","Apr 30"],[1,"Cut Ruiz before tag window","Mar 1"],[0,"Restructure Allen (frees $4.1M)","Mar 18"],[0,"Stash 2 rookies on taxi","May 2"],[0,"Review AFC North arms race","Jun 1"],[0,"Extend Baird before RFA","Mar 18"],[0,"Decide on Kincaid (age 29)","Apr 1"],[0,"Sell aging WR depth","Apr 15"],[0,"Set taxi before cut-down","Aug 28"],[0,"Check dead cap after cuts","Aug 30"]];
const CAP=[["2026","$12.4M room","3 expiring"],["2027","$21.0M room","RFA: Baird"],["2028","$38.7M room","UFA: Kelce"],["2029","$55.2M room",""]];
const FORM=[["J. Allen",[22,31,18,26,24.6],24],["Baird",[14,22,9,19,19.8],17],["Pacheco",[11,8,17,14,12.1],13],["Kelce",[9,12,6,14,11],10],["A. Brown",[19,4,25,12,8.2],14],["Parsons",[6,11,9,4,9],8]];

// ---------- registry ----------
// spans: allowed sizes; src = home screen of the data; link = registered route; refresh = policy
const T={
 due:{t:"DECISIONS DUE",src:"Clock + alerts",prov:"leagueclock.ActionCalendar + control.Alerts",link:"HQ ›",refresh:"on clock tick · 60s",spans:["1x1","1x2"],r:tDue},
 mu:{t:"THIS WEEK",src:"League Pulse · Live",prov:"pulse.Matchup(week, mine)",link:"LIVE ›",refresh:"live push",spans:["1x1","2x1","1x2"],r:tMu},
 race:{t:"RACE",src:"League Pulse · Race",prov:"pulse.Standings + run-in",link:"RACE ›",refresh:"after each final",spans:["1x1","2x1"],r:tRace},
 head:{t:"LEAGUE HEADLINES",src:"League record",prov:"facts from scores, trades, streaks",link:"PULSE ›",refresh:"on event",spans:["1x1","2x1","1x2"],r:tHead},
 wire:{t:"TRANSACTIONS",src:"League ledger",prov:"ledger.Transactions(league)",link:"LEDGER ›",refresh:"on event",spans:["1x1","2x1","1x2"],r:tWire},
 sc:{t:"MY SHORTCUTS",src:"Owner",prov:"owner pins (☆)",link:"",refresh:"—",spans:["1x1","2x1"],r:tSc},
 pwr:{t:"POWER",src:"League Pulse · Race",prov:"pulse.Power(horizon)",link:"POWER ›",refresh:"weekly",spans:["1x1","1x2"],r:tPwr},
 plan:{t:"PLANS",src:"War Room · Plans",prov:"plans.Checklist(active)",link:"PLANS ›",refresh:"on edit",spans:["1x1","1x2"],r:tPlan},
 picks:{t:"MY PICKS",src:"War Room · Draft Room",prov:"draft.OwnedPicks",link:"DRAFT ›",refresh:"on trade",spans:["1x1"],r:tPicks},
 cap:{t:"CAP RUNWAY",src:"Franchise HQ",prov:"cap.Runway(4y)",link:"CAP ›",refresh:"on move",spans:["1x1"],r:tCap},
 bids:{t:"MY BIDS",src:"War Room · Market",prov:"market.MyBids",link:"MARKET ›",refresh:"on bid",spans:["1x1"],r:tBids},
 form:{t:"FORM · LAST 5",src:"Franchise HQ",prov:"stats.Form(starters,5)",link:"HQ ›",refresh:"after each final",spans:["1x1","2x1"],r:tForm}};
const DEF={in:[["mu","1x1"],["due","1x1"],["race","1x1"],["head","1x1"],["wire","1x1"],["sc","1x1"]],
           off:[["pwr","1x1"],["due","1x1"],["plan","1x1"],["picks","1x1"],["head","1x1"],["wire","1x1"]]};
const NOW={in:["LIVE","Week 9 · you lead Ironclads 121.6 – 113.0 · lineups lock Sun 12:00",[["5-3","RECORD"],["6","SEED"],["5","POWER"],["$12.4M","CAP ROOM"]]],
           off:["OFFSEASON","Tag window closes Mar 4 · rookie draft Apr 30 · free agency Mar 20",[["5","POWER · DYN"],["1.07","FIRST PICK"],["$21.0M","2027 ROOM"],["44/44","ROSTER"]]]};

// ---------- packer: fixed 3 cols x 2 rows ----------
function pack(lay){const g=[[0,0,0],[0,0,0]],out=[];
  for(const [id,sp] of lay){const [w,h]=sp.split("x").map(Number);let ok=false;
    for(let r=0;r<=2-h&&!ok;r++)for(let c=0;c<=3-w&&!ok;c++){let free=true;
      for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++)if(g[y][x])free=false;
      if(free){for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++)g[y][x]=1;out.push([id,sp,r,c,w,h]);ok=true}}
    if(!ok)return null}
  return out}

// ---------- tiles ----------
const r=(cls,html)=>`<div class="r ${cls}">${html}</div>`;
function tDue(){return DUE[H.phase].map(d=>r("dq",`<span class="k ${d[0]}">${d[0].toUpperCase()}</span><span class="nm">${d[1]}</span><span class="m">${d[2]}</span><span class="clock${/d/.test(d[3])&&parseInt(d[3])>3?" cold":""}" style="text-align:right">${d[3]}</span>`)).join("")}
function tMu(sp){const wide=sp!=="1x1";
  return `<div class="mx"><div class="sd me"><b>${ME}</b><span>5-3 · proj 141.2</span><div class="sc">121.6</div></div><div class="vs">vs</div><div class="sd op rt"><b>${OPP}</b><span>4-4 · proj 128.8</span><div class="sc">113.0</div></div></div>
  <div class="wpl"><span class="g">68%</span><span class="m" style="font:10px var(--mono);color:var(--ink3)">WIN %</span><span class="a">32%</span></div><div class="wpb"><i style="width:68%"></i><u></u></div>
  <div class="prog"><div><b>6</b><span>PLAYING</span></div><div><b>4</b><span>YET TO PLAY</span></div><div><b>6</b><span>DONE</span></div></div>
  ${DUO.map(d=>r("duo",`<span class="nm">${d[0]} <span class="m">${d[1]}</span></span><span class="v me">${d[2].toFixed(1)}</span><span class="v op">${d[3].toFixed(1)}</span><span class="nm rt">${d[4]}</span>`)).join("")}`}
function tRace(){return `<div class="seedl"><div><b>6</b><span>SEED NOW</span></div><div><b class="arw">7</b><span>PROJECTED<span class="bub">BUBBLE</span></span></div><div><b>54%</b><span>PLAYOFF ODDS</span></div><div><b>5</b><span>POWER</span></div></div>
  <div class="runin">${RUN.map(x=>`<div class="${x[3]?"lead":""}">WK ${x[0]}<b>${x[1]}</b><i class="${x[2]>=65?"g":x[2]<=35?"a":""}">${x[2]}%</i></div>`).join("")}</div>
  <div class="m" style="padding:6px 12px;font:10px var(--mono);color:var(--amber);border-bottom:1px solid var(--edge)">3 OF NEXT 4 vs DIVISION LEADERS ★</div>
  ${MINI.map(m=>r("mini "+m[3],`<span class="m">${m[0]}</span><span class="nm">${m[1]}</span><span class="v">${m[2]}</span><span class="m" style="text-align:right">${m[3]==="cut"?"CUT ─":""}</span>`)).join("")}`}
function tHead(){return HEAD.map(h=>r("hl",`<span class="k">${h[0]}</span><span class="nm">${h[1]}</span><span class="m">wk 8</span>`)).join("")}
function tWire(){return WIRE.map(w=>r("wire",`<span class="m">${w[0]}</span><span class="k">${w[1]}</span><span class="nm">${w[2]}</span>`)).join("")}
function tSc(sp){const s=[["Set lineup","HQ","L"],["Trade Desk","War Room","T"],["Market","War Room","M"],["Live","Pulse","G"],["Race","Pulse","R"],["Cap","HQ","C"],["Draft Room","War Room","D"],["Plans","War Room","P"],["Archive","Pulse","A"],["Rules","Control","U"]];
  return `<div class="scg" style="${sp==="2x1"?"grid-template-columns:repeat(4,1fr)":""}">${s.map(x=>`<button class="scb">${x[0]} <span class="w">${x[1]}</span><kbd>${x[2]}</kbd></button>`).join("")}</div>`}
function tPwr(){return `<div class="m" style="padding:6px 12px;font:10px var(--mono);color:var(--ink3);border-bottom:1px solid var(--edge)">DYNASTY · 3 YR · value 35 · age 20 · picks 20 · cap 15 · depth 10</div>`+
  PWR.map(p=>r("pw"+(p[1]===ME?" me":""),`<span class="m">${p[0]}</span><span class="nm">${p[1]}</span><span class="v">${p[2]}</span><span class="bar"><i style="width:${p[2]}%"></i></span>`)).join("")}
function tPlan(){return `<div class="m" style="padding:6px 12px;font:10px var(--mono);color:var(--ink3);border-bottom:1px solid var(--edge)">PLAN A · "RELOAD AT CB" · 2 OF 8 CHECKED</div>`+
  PLAN.map(p=>r("pl"+(p[0]?" done":""),`<span class="bx${p[0]?" on":""}"></span><span class="nm">${p[1]}</span><span class="m" style="text-align:right">${p[2]}</span>`)).join("")}
function tPicks(){return PICKS.map(p=>r("pk",`<span class="v" style="text-align:left">${p[0]}</span><span class="nm m">${p[1]}</span><span class="m" style="text-align:right">${p[2]}</span>`)).join("")}
function tCap(){return `<div class="capr"><b>$12.4M</b><span>ROOM 2026 · of $200M</span><div class="capbar"><i style="width:84%"></i><u style="width:9.8%"></u><s></s></div><div class="m" style="font:10px var(--mono);color:var(--ink3);margin-top:5px">■ committed · ▨ dead $19.6M · □ room</div></div>`+
  CAP.map(c=>r("yr",`<span class="v" style="text-align:left">${c[0]}</span><span class="nm">${c[1]}</span><span class="m" style="text-align:right">${c[2]}</span>`)).join("")}
function tBids(){return BIDS.map(b=>r("bd",`<span class="nm">${b[0]}</span><span class="v">${b[1]}</span><span class="k ${b[3]}">${b[2]}</span>`)).join("")}
function tForm(){return FORM.map(f=>r("pw",`<span class="m">${f[0].split(" ").pop().slice(0,3).toUpperCase()}</span><span class="nm">${f[0]}</span><span class="v">${f[2]}</span><span class="form" style="display:flex;gap:2px;align-items:end;height:18px">${f[1].map(v=>`<i style="width:8px;height:${Math.min(18,v/1.8)}px;background:var(--edge-hi);display:block"></i>`).join("")}</span>`)).join("")}

// ---------- alerts (only kinds the engine produces today: lineup, trades, ir, bye) ----------
const AL=[{id:"trades:ironclads:o-118",k:"TRADE OFFER",u:"crit",t:"Ironclads offer Waddle + 2027 2nd for Pacheco",d:"Expires Fri 18:00 · you have not opened it",c:"5h 40m",go:"OPEN OFFER ›"},
  {id:"lineup:w9:flex",k:"LINEUP",u:"hi",t:"FLEX hole: Kincaid ruled OUT",d:"Best eligible: T. Ames (RB) · proj 11.2",c:"2d 1h",go:"SET LINEUP ›"},
  {id:"bye:w10:te",k:"BYE",u:"hi",t:"Week 10: only 1 TE not on bye",d:"Kelce on bye · TE slot needs 1",c:"9d",go:"ROSTER ›"},
  {id:"ir:mixon",k:"IR",u:"low",t:"Mixon activated by his NFL team",d:"No longer IR-eligible · move or release",c:"4d 7h",go:"IR ›"}];
const live=()=>AL.filter(a=>!H.snz[a.id]);
function renderBand(){const b=$("#aband");b.className="aband";
  if(H.alerts==="none"){b.classList.add("none");b.innerHTML="";return}
  if(H.alerts==="fail"){b.classList.add("unavail");b.innerHTML=`<span class="ak">ALERTS UNAVAILABLE</span><span class="at">Last check failed 14:02 · retrying every 60s · this is not an all-clear</span><span class="more">DETAILS ▸</span>`;return}
  const L=live();if(!L.length){b.classList.add("none");return}
  const a=L[0];if(a.u==="crit")b.classList.add("crit");
  b.innerHTML=`<span class="ak">▲ ${a.k}</span><span class="at">${a.t}</span><span class="clock">${a.c}</span><button class="go">${a.go}</button><span class="more">${L.length>1?`<b>+${L.length-1}</b>`:""}ALL ALERTS ▸</span>`}
function renderAlerts(){const n=Object.keys(H.snz).length;
  $("#sds").textContent=H.alerts==="fail"?"check failed":`${live().length} active · ${n} snoozed · most urgent first`;
  if(H.alerts==="fail"){$("#sdb").innerHTML=`<div class="al"><span class="s" style="background:var(--edge)"></span><div class="b"><div class="t1">Alert check failed at 14:02</div><div class="t2">Lineup, trade, IR and bye checks did not finish. Nothing here means "all clear" until a check succeeds.</div><div class="acts"><button class="btn">RETRY NOW</button></div></div></div>`;return}
  $("#sdb").innerHTML=AL.map(a=>`<div class="al ${a.u}${H.snz[a.id]?" snz":""}" data-id="${a.id}"><span class="s"></span><div class="b">
    <div class="h"><span class="k">${a.k}</span><span class="clock">${a.c}</span></div><div class="t1">${a.t}</div><div class="t2">${a.d}</div>
    ${H.snz[a.id]?`<div class="why">SNOOZED until ${H.snz[a.id]} · returns sooner if it gets more urgent</div><div class="acts"><button class="btn" data-un="1">UNSNOOZE</button></div>`
     :`<div class="acts"><button class="btn g2">${a.go}</button><button class="btn" data-s="1H">SNOOZE 1H</button><button class="btn" data-s="08:00">UNTIL 8 AM</button></div>`}</div></div>`).join("")+
   `<div class="why" style="padding:10px 16px;font:10px var(--mono);color:var(--ink3)">Alerts ignore layout settings. Snooze hides one alert for a set time; it cannot turn a kind off.</div>`}

// ---------- render ----------
function curLay(){return H.mode==="default"?DEF[H.phase].map(x=>[...x]):H.lay}
function render(){
  const [tag,line,st]=NOW[H.phase];
  $("#now").innerHTML=`<div class="nl"><span class="tag">${tag}</span>${line}</div>`+st.map(s=>`<div class="st"><b>${s[0]}</b><span>${s[1]}</span></div>`).join("");
  $("#rnow").innerHTML=`<span class="tag">NOW</span>${H.phase==="in"?"Lineups lock Sun":"Tag window · Mar 4"}`;
  $("#rph").innerHTML=H.phase==="in"?"Legacy NFL · <i>Wk 9 · 6 live</i>":"Legacy NFL · <i>Offseason</i>";
  $("#lay").innerHTML=`LAYOUT <b>${H.mode==="default"?"DEFAULT · "+(H.phase==="in"?"IN-SEASON":"OFFSEASON"):"MINE (custom)"}</b>`;
  renderBand();
  const P=pack(curLay());
  $("#grid").innerHTML=P.map(([id,sp,rr,c,w,h])=>{const d=T[id];
    return `<article class="t${H.sel===id?" sel":""}" data-id="${id}" draggable="${H.edit}" style="grid-row:${rr+1}/span ${h};grid-column:${c+1}/span ${w}">
    <div class="th"><span class="ed"><span class="grip" title="Drag to move">⠿</span></span><b>${d.t}</b><span class="src">${d.src}</span>
     ${d.link?`<button class="lnk">${d.link}</button>`:""}
     <span class="ed" style="margin-left:auto">${["1x1","2x1","1x2"].map(s=>`<button class="sp" data-sp="${s}" aria-pressed="${s===sp}" ${d.spans.includes(s)?"":"disabled"}>${s.replace("x","×")}</button>`).join("")}
     <button class="pin${H.pins[id]?" on":""}" title="Pin this screen to MY SHORTCUTS">${H.pins[id]?"★":"☆"}</button><button class="off" title="Move to overflow">✕</button></span></div>
    <div class="tb">${d.r(sp)}</div><div class="tf"><span>as of ${id==="mu"?"14:06:12 · live":"14:05"}</span><span class="more"></span></div></article>`}).join("");
  trim();renderTray();renderInsp();
}
// rows that don't fit are dropped whole, and the footer says how many live in the source screen
function trim(){$$(".t").forEach(t=>{const b=t.querySelector(".tb"),lim=b.getBoundingClientRect().bottom+0.5;let cut=0;
  [...b.querySelectorAll(".r")].reverse().forEach(x=>{if(x.getBoundingClientRect().bottom>lim){x.remove();cut++}});
  t.querySelector(".tf .more").textContent=cut?`+${cut} more in ${T[t.dataset.id].link.replace(" ›","")||"source"}`:""})}
function renderTray(){const p=$("#pulls"),n=live().length;
  p.innerHTML=`<button class="pull" data-p="al" aria-expanded="${$("#sd").classList.contains("open")}">ALERTS <b>${H.alerts==="fail"?"?":H.alerts==="none"?0:n}</b></button>`+
   (H.edit?`<button class="pull" data-p="add">ADD TILE <b>+</b></button>`:"")+
   `<button class="pull" data-p="ov">OVERFLOW <b>${H.over.length}</b></button>`;
  const m=$("#tmsg");
  if(H.pick){m.className="msg ask";m.textContent=`Grid full · click the tile to move to OVERFLOW to make room for ${T[H.pick.id].t} ${H.pick.sp.replace("x","×")}`}
  else{m.className="msg";m.textContent=H.edit?"CUSTOMIZE · drag ⠿ to move · size buttons resize · ✕ sends to overflow · nothing commits from Home":"Home reads and links only · nothing here changes the league"}
  $("#tact").innerHTML=H.pick?`<button class="btn" id="pcancel">CANCEL</button>`:
    H.edit?`<button class="btn" id="phdef">USE THIS PHASE'S DEFAULT</button><button class="btn" id="reset">RESET TO DEFAULT</button><button class="btn solid" id="done">DONE</button>`:"";
  $("#custom").classList.toggle("on",H.edit)}
function renderInsp(){const id=H.sel,d=id&&T[id];
  $("#insp").innerHTML=`<div class="ihead"><div class="top"><span class="on">MY FRANCHISE</span><span class="m" style="font:11px var(--mono);color:var(--ink3)">AFC North</span></div><div class="nm">${ME}</div><div class="sub">Owner: you · since 2013 · window: WIN NOW</div></div>
  <div class="nums"><div><b>5-3</b><span>RECORD · SEED 6</span></div><div><b>#5</b><span>POWER · SEASON</span></div></div>
  <div class="idrawers" style="overflow:hidden">${d?`<div class="ch"><b>SELECTED TILE</b><span>${d.t}</span></div><div class="kv3">
   <span>ID</span><span class="mono">${id}</span><span>SOURCE</span><span>${d.src}</span><span>PROVIDER</span><span class="mono" style="font-size:11px">${d.prov}</span>
   <span>REFRESH</span><span>${d.refresh}</span><span>AS OF</span><span>${id==="mu"?"14:06:12 · live":"14:05 · fresh"}</span><span>OPENS</span><span>${d.link||"—"}</span>
   <span>SIZES</span><span>${d.spans.map(s=>s.replace("x","×")).join(" · ")}</span><span>STATES</span><span>loading · empty · stale · unavailable · error</span></div>`
   :`<div class="ch"><b>SELECTED TILE</b><span>none</span></div><div class="empty">Click a tile to see where its data comes from, how fresh it is and where it opens.</div>`}
   <div class="ch" style="border-top:2px solid var(--black)"><b>LAYOUT</b><span>saved per owner · per league</span></div><div class="kv3">
   <span>MODE</span><span>${H.mode==="default"?"Default · follows season phase":"Custom · never moves on its own"}</span><span>TILES</span><span>${pack(curLay()).length} on grid · ${H.over.length} in overflow</span>
   <span>ALERTS</span><span>always on top · not part of the layout</span></div></div>
  <div></div><div class="ifoot"><span>${H.edit?"CUSTOMIZE ON":"read only"}</span><button>+ MY DRAWER</button></div>`}

// ---------- drawers ----------
function openBd(kind){const bd=$("#bd");
  if(bd.classList.contains("open")&&bd.dataset.k===kind){bd.classList.remove("open");renderTray();return}
  bd.dataset.k=kind;$("#sd").classList.remove("open");
  const onGrid=new Set(pack(curLay()).map(x=>x[0]));
  if(kind==="add"){$("#bdt").textContent="ADD TILE";$("#bds").textContent="registered summary tiles · each opens its home screen";
    $("#bdb").innerHTML=`<div class="addg">${Object.entries(T).map(([id,d])=>`<button class="at2${onGrid.has(id)?" on":""}${H.over.includes(id)?" ov":""}" data-add="${id}"><b>${d.t}</b><span class="s">${d.spans.map(s=>s.replace("x","×")).join(" ")}</span><span class="d">${d.src}${onGrid.has(id)?" · on grid":H.over.includes(id)?" · in overflow":""}</span></button>`).join("")}</div>`}
  else{$("#bdt").textContent="OVERFLOW";$("#bds").textContent="tiles you moved off the grid · kept, never deleted";
    $("#bdb").innerHTML=H.over.length?`<div class="addg">${H.over.map(id=>`<button class="at2 ov" data-add="${id}"><b>${T[id].t}</b><span class="s">RESTORE</span><span class="d">${T[id].src}</span></button>`).join("")}</div>`
     :`<div class="empty" style="padding:26px">Overflow is empty. When the grid is full, a tile you bump lands here instead of being lost.</div>`}
  bd.classList.add("open");renderTray()}
function closeAll(){$("#bd").classList.remove("open");$("#sd").classList.remove("open");renderTray()}

// ---------- customize actions ----------
function toCustom(){if(H.mode==="default"){H.lay=curLay();H.mode="custom"}}
function place(id,sp){toCustom();const L=H.lay.filter(x=>x[0]!==id);const i=H.lay.findIndex(x=>x[0]===id);
  const N=[...L];N.splice(i<0?N.length:i,0,[id,sp]);
  if(pack(N)){H.lay=N;H.over=H.over.filter(x=>x!==id);return true}
  H.pick={id,sp};return false}
function bump(victim){const {id,sp}=H.pick;H.pick=null;toCustom();
  const i=H.lay.findIndex(x=>x[0]===victim);let N=H.lay.filter(x=>x[0]!==victim&&x[0]!==id);N.splice(Math.min(i,N.length),0,[id,sp]);
  if(!pack(N)){$("#tmsg").textContent=`Still no room after moving ${T[victim].t} · pick another`;H.pick={id,sp};return}
  H.lay=N;H.over=[...H.over.filter(x=>x!==id),victim]}

// ---------- wiring ----------
document.addEventListener("click",e=>{const t=e.target;
  if(t.closest("#phase button")){H.phase=t.dataset.p;$$("#phase button").forEach(b=>b.setAttribute("aria-pressed",b===t));
    if(H.mode==="custom")$("#tmsg").textContent="Phase changed · your custom layout stays put";render();return}
  if(t.closest("#ademo button")){H.alerts=t.dataset.a;$$("#ademo button").forEach(b=>b.setAttribute("aria-pressed",b===t));renderAlerts();render();return}
  if(t.closest("#custom")){H.edit=!H.edit;H.pick=null;document.body.classList.toggle("editing",H.edit);document.body.classList.remove("picking");if(!H.edit)closeAll();render();return}
  if(t.id==="done"){H.edit=false;document.body.classList.remove("editing","picking");closeAll();render();return}
  if(t.id==="reset"){H.mode="default";H.lay=null;H.over=[];H.pins={};render();return}
  if(t.id==="phdef"){H.mode="default";H.lay=null;render();return}
  if(t.id==="pcancel"){H.pick=null;document.body.classList.remove("picking");render();return}
  if(t.closest("#aband")){$("#bd").classList.remove("open");$("#sd").classList.toggle("open");renderAlerts();renderTray();return}
  if(t.id==="sdclose"||t.id==="bdclose"){closeAll();return}
  const pl=t.closest(".pull");if(pl){const k=pl.dataset.p;if(k==="al"){$("#bd").classList.remove("open");$("#sd").classList.toggle("open");renderAlerts();renderTray()}else openBd(k);return}
  const al=t.closest(".al");if(al&&t.dataset.s){H.snz[al.dataset.id]=t.dataset.s==="1H"?"15:06":"08:00";renderAlerts();render();return}
  if(al&&t.dataset.un){delete H.snz[al.dataset.id];renderAlerts();render();return}
  const ad=t.closest("[data-add]");if(ad&&!ad.classList.contains("on")){const id=ad.dataset.add;
    if(place(id,T[id].spans[0])){openBd($("#bd").dataset.k);openBd($("#bd").dataset.k)}else{closeAll();document.body.classList.add("picking")}render();return}
  const tile=t.closest(".t");if(!tile)return;const id=tile.dataset.id;
  if(H.pick){bump(id);document.body.classList.toggle("picking",!!H.pick);render();return}
  if(t.dataset.sp&&!t.disabled){if(!place(id,t.dataset.sp))document.body.classList.add("picking");render();return}
  if(t.classList.contains("pin")){H.pins[id]=!H.pins[id];render();return}
  if(t.classList.contains("off")){toCustom();H.lay=H.lay.filter(x=>x[0]!==id);H.over.push(id);render();return}
  H.sel=id;render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(H.pick){H.pick=null;document.body.classList.remove("picking");render()}else closeAll()}});
// drag to swap (keyboard alternative ships in product)
let dragId=null;
document.addEventListener("dragstart",e=>{const t=e.target.closest(".t");if(!t||!H.edit)return;dragId=t.dataset.id;t.classList.add("dragging")});
document.addEventListener("dragover",e=>{const t=e.target.closest(".t");if(!t||!dragId)return;e.preventDefault();$$(".t.over").forEach(x=>x.classList.remove("over"));if(t.dataset.id!==dragId)t.classList.add("over")});
document.addEventListener("drop",e=>{const t=e.target.closest(".t");if(!t||!dragId)return;e.preventDefault();toCustom();
  const a=H.lay.findIndex(x=>x[0]===dragId),b=H.lay.findIndex(x=>x[0]===t.dataset.id),N=H.lay.map(x=>[...x]);[N[a],N[b]]=[N[b],N[a]];
  if(pack(N))H.lay=N;else $("#tmsg").textContent="Those two sizes don't fit swapped · resize one first";dragId=null;render()});
document.addEventListener("dragend",()=>{dragId=null;$$(".t").forEach(x=>x.classList.remove("dragging","over"))});
window.addEventListener("resize",render);
renderAlerts();render();
</script></body></html>
