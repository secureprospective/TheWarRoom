<!doctype html><html lang="en"><head><meta charset="utf-8"><title>TheWarRoom · Home mock v5</title><style>
:root{
  --canvas:hsl(220,20%,6%); --sunken:hsl(220,22%,4%); --tile:hsl(220,18%,9%); --raised:hsl(220,18%,12%);
  --ink:hsl(220,20%,94%); --ink2:hsl(220,12%,74%); --ink3:hsl(220,10%,56%);
  --edge:hsl(220,10%,28%); --edge-hi:hsl(220,8%,82%); --black:hsl(220,25%,2%); --rule:hsl(220,15%,13%);
  --green:hsl(145,50%,58%); --blue:hsl(210,80%,66%); --amber:hsl(38,92%,58%); --red:hsl(358,75%,62%);
  --mono:"JetBrains Mono","DejaVu Sans Mono",monospace; --sans:"Inter","Noto Sans",system-ui,sans-serif;
  --knurl:repeating-linear-gradient(45deg,hsla(0,0%,100%,.035) 0 1px,transparent 1px 4px),
          repeating-linear-gradient(-45deg,hsla(0,0%,0%,.35) 0 1px,transparent 1px 4px);
  --hazard:repeating-linear-gradient(-45deg,var(--edge-hi) 0 6px,var(--black) 6px 12px);
  --hatch:repeating-linear-gradient(-45deg,hsla(220,8%,82%,.10) 0 5px,transparent 5px 10px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--canvas);color:var(--ink);font:13px/1.35 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono,.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:224px 1fr 316px;height:100%}

/* ---------- rail (option 3, ruled) ---------- */
.rail{background:var(--tile);background-image:var(--knurl);border-right:3px solid var(--black);display:flex;flex-direction:column}
.rail-head{padding:14px 14px 12px;border-bottom:2px solid var(--black)}
.lg{font:700 12px var(--mono);letter-spacing:.16em}
.ph{margin-top:6px;font:11px var(--mono);color:var(--ink2)} .ph i{font-style:normal;color:var(--green)}
.rail-body{flex:1;padding:6px 0;overflow:hidden}
.gl{padding:10px 14px 4px;font:600 10px var(--mono);letter-spacing:.16em;color:var(--ink3)}
.node>.nb{width:100%;display:flex;align-items:center;gap:10px;padding:8px 14px;text-align:left;font-weight:600;border-left:4px solid transparent;transition:transform 70ms linear}
.nb .k{font:11px var(--mono);color:var(--ink3);width:10px}
.nb .car{margin-left:auto;font:11px var(--mono);color:var(--ink3)}
.nb:hover{transform:translateX(2px);background:var(--raised)}
.node.open>.nb{background:var(--raised);border-image:var(--hazard) 1}
.node.open .car{transform:rotate(90deg)}
.mark{width:6px;height:6px;background:var(--green);margin-left:4px}
.leaf{display:flex;gap:6px;width:100%;padding:5px 14px 5px 26px;text-align:left;color:var(--ink2);font-size:12.5px;transition:transform 70ms linear}
.leaf:hover{color:var(--ink);transform:translateX(2px)}
.leaf .tr{font-family:var(--mono);color:var(--edge)}
.leaf.sel{color:var(--ink);font-weight:600} .leaf.sel .tr::after{content:"▮";color:var(--edge-hi)}
.leaf.now{border:1px solid var(--edge);margin:2px 10px 4px 22px;width:calc(100% - 32px);padding-left:8px;color:var(--ink)}
.tag{font:700 9px var(--mono);letter-spacing:.12em;background:var(--edge-hi);color:var(--black);padding:1px 4px;align-self:center}
.rail-foot{border-top:2px solid var(--black);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font:11px var(--mono);color:var(--ink3)}

/* ---------- shared controls ---------- */
.btn{border:2px solid var(--edge);padding:6px 11px;font:600 11px var(--mono);letter-spacing:.06em;transition:transform 70ms linear,box-shadow 70ms linear}
.btn:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--black);border-color:var(--edge-hi)}
.btn:active{transform:none;box-shadow:none}
.btn.g2{border-width:2px;border-color:var(--edge-hi)}
.btn.solid{background:var(--edge-hi);color:var(--black);border-color:var(--edge-hi)}
.pg{display:inline-block;min-width:26px;text-align:center;border:1px solid var(--ink3);font:600 10px var(--mono);padding:0 3px;color:var(--ink2)}

/* ---------- workspace ---------- */
.work{position:relative;display:grid;grid-template-rows:auto auto 1fr auto;min-width:0;overflow:hidden}
.ws-tabs{display:flex;align-items:stretch;border-bottom:2px solid var(--black);background:var(--sunken)}
.ws-tabs button{padding:11px 16px;font:600 11px var(--mono);letter-spacing:.1em;color:var(--ink3);border-right:1px solid var(--black)}
.ws-tabs button[aria-selected=true]{color:var(--ink);background:var(--canvas);box-shadow:inset 0 3px 0 var(--edge-hi)}
.queue{margin-left:auto;display:flex;align-items:stretch;border-left:2px solid var(--black);transition:transform 70ms linear}
.queue:hover{transform:translateY(1px)}
.queue .ql{display:flex;align-items:center;padding:0 12px;font:700 10px var(--mono);letter-spacing:.14em;background:var(--tile);background-image:var(--knurl);color:var(--ink)}
.queue .qn{display:flex;align-items:center;padding:0 10px;font:700 10px var(--mono);letter-spacing:.08em;border-left:1px solid var(--black);color:var(--ink2)}
.queue .qn.need{background:var(--amber);color:var(--black)}
.queue .qn.dim{color:var(--ink3)}
.queue.on .ql{background:var(--edge-hi);color:var(--black)}
.ws-tabs .cmd{display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--ink3);font:11px var(--mono)}
.ws-tabs .cmd kbd{border:1px solid var(--edge);padding:1px 5px;color:var(--ink2)}

/* the franchise plate: one line, every number earns its place */
.plate{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;padding:10px 20px;border-bottom:2px solid var(--black)}
.who b{font-size:20px;letter-spacing:-.01em}
.who div{font:11px var(--mono);color:var(--ink2);margin-top:3px}
.cap{display:grid;gap:6px}
.cap-top{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--ink3);letter-spacing:.08em}
.cap-top b{color:var(--ink);font-weight:600}
.cap-bar{display:flex;height:12px;border:1px solid var(--edge);background:var(--sunken)}
.cap-bar span{height:100%;border-right:2px solid var(--black)}
.seg-c{background:var(--edge-hi)} .seg-d{background:var(--hatch),var(--ink3)} .seg-r{background:transparent}
.cap-key{display:flex;gap:16px;font:11px var(--mono);color:var(--ink2)}
.cap-key i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px;border:1px solid var(--edge)}
.check{border:2px solid var(--edge-hi);padding:8px 12px;display:grid;gap:2px;min-width:190px}
.check .h{font:700 10px var(--mono);letter-spacing:.14em;color:var(--ink3)}
.check .v{font-weight:600}
.check .v .warn{color:var(--amber)}
.check .t{font:11px var(--mono);color:var(--amber)}

/* main board: starters | bench, both fixed-height */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(430px,32%);gap:0;min-height:0;border-bottom:2px solid var(--black)}
.col{display:flex;flex-direction:column;min-height:0;border-right:2px solid var(--black)}
.col:last-child{border-right:0}
.sec{display:flex;justify-content:space-between;padding:7px 14px 5px;font:700 10px var(--mono);letter-spacing:.14em;color:var(--ink3);background:var(--sunken);border-bottom:1px solid var(--edge)}
.sec span{font-weight:400}
.ch{display:flex;align-items:baseline;justify-content:space-between;padding:10px 14px 8px;border-bottom:1px solid var(--edge)}
.ch b{font:700 11px var(--mono);letter-spacing:.14em}
.ch span{font:11px var(--mono);color:var(--ink3)}
.slots{flex:none}
.mu{flex:1;min-height:0;overflow:hidden;border-top:2px solid var(--black);display:flex;flex-direction:column}
.mu-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px;gap:14px;border-bottom:1px solid var(--edge)}
.mu-h .side b{display:block;font:700 22px var(--mono)}
.mu-h .side span{font:11px var(--mono);color:var(--ink3)}
.mu-h .them{text-align:right}
.wp{width:260px;display:grid;gap:4px;text-align:center;font:11px var(--mono);color:var(--ink2)}
.wp .bar{display:flex;height:10px;border:1px solid var(--edge)}
.wp .bar i{background:var(--edge-hi)}
.mu-rows{display:grid;grid-template-columns:1fr 1fr;align-content:start}
.mu-rows div{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;padding:0 14px;height:28px;align-items:center;border-bottom:1px solid var(--rule);font-size:12px}
.mu-rows div:nth-child(odd){border-right:1px solid var(--rule)}
.mu-rows .n{text-align:right}
.slot{display:grid;grid-template-columns:52px 34px 230px 150px 64px 52px 44px 1fr;align-items:center;gap:8px;height:30px;
  padding:0 14px;border-bottom:1px solid var(--rule);transition:transform 70ms linear;cursor:pointer}
.slot:hover{background:var(--raised);transform:translateX(2px)}
.slot .sl{font:600 10px var(--mono);letter-spacing:.06em;color:var(--ink3)}
.slot .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .nm small{color:var(--ink3);font:11px var(--mono);margin-left:6px}
.slot .pr{font-family:var(--mono);text-align:right}
.slot .st{font:600 10px var(--mono);text-align:right}
.st.bye{color:var(--ink3)} .st.q{color:var(--amber)} .st.out{color:var(--red)} .st.live{color:var(--blue)}
.form{position:relative;display:flex;gap:2px;align-items:flex-end;height:22px;justify-self:start;border-bottom:1px solid var(--edge)}
.form i{width:10px;background:hsl(220,9%,30%);transition:transform 70ms linear}
.form i.up{background:hsl(220,10%,62%)}
.form i.bye{height:100%!important;background:repeating-linear-gradient(-45deg,hsl(220,9%,34%) 0 2px,transparent 2px 5px)}
.form .pj{position:absolute;left:0;width:58px;height:0;border-top:1px dashed hsl(220,8%,50%);pointer-events:none}
.form b{font:10px var(--mono);color:var(--ink2);margin-left:8px;align-self:center;font-weight:400}
.form i:hover{transform:scaleY(1.08);outline:1px solid var(--edge-hi)}
.blist .form i{width:9px}.blist .form .pj{width:53px}.blist .form b{display:none}
.form em{font:10px var(--mono);color:var(--ink3);font-style:normal;margin-right:6px;align-self:center}
@container (max-width:640px){.board .col:first-child .form{display:none}}
.board .col:first-child{container-type:inline-size}
.slot.gap{background:repeating-linear-gradient(-45deg,hsla(220,8%,82%,.22) 0 6px,hsla(220,25%,2%,.6) 6px 12px);outline:2px solid var(--edge-hi);outline-offset:-2px;box-shadow:inset 6px 0 0 var(--amber)}
.slot.gap .sl{color:var(--ink);padding-left:4px}
.slot.gap .st{background:var(--amber);color:var(--black);text-align:center;padding:2px 0;font-weight:700}
.slot.gap .nm{color:var(--ink);font-weight:600;background:var(--black);padding:2px 8px;justify-self:start}
.slot.target{outline:1px dashed var(--edge-hi);outline-offset:-3px}
.drag{cursor:grab;touch-action:none;transition:transform 70ms linear,box-shadow 70ms linear}
.drag:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--black);border-color:var(--edge-hi);color:var(--ink)}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;background:var(--edge-hi);color:var(--black);border-color:var(--edge-hi);box-shadow:3px 3px 0 var(--black);padding:2px 8px}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
.slot.over{background:var(--raised);outline:2px solid var(--edge-hi);outline-offset:-2px}
.bench.dropzone .blist{outline:2px dashed var(--edge-hi);outline-offset:-4px}
.slot.chg{box-shadow:inset 4px 0 0 var(--edge-hi);background:var(--raised)}
.slot.picked{background:var(--raised);box-shadow:inset 4px 0 0 var(--edge-hi)}

.bench .filters{display:flex;gap:3px;padding:8px 14px;border-bottom:1px solid var(--edge)}
.chip{font:600 10px var(--mono);padding:2px 0;flex:1;text-align:center;border:1px solid var(--edge);color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--edge-hi);color:var(--black);border-color:var(--edge-hi)}
.blist{flex:none;max-height:calc(30px * 22);overflow:auto}
.inl{flex:1;min-height:0;overflow:hidden}
.inl .sec{border-top:2px solid var(--black)}
.inl .slot{height:30px;grid-template-columns:34px minmax(150px,1fr) 64px 52px}
.blist .slot{height:30px;grid-template-columns:34px minmax(130px,190px) 96px 58px 44px 1fr}
.blist::-webkit-scrollbar{width:8px} .blist::-webkit-scrollbar-thumb{background:var(--edge)}

/* action tray: the only home for commit controls */
.tray{display:flex;align-items:center;gap:10px;padding:10px 20px;white-space:nowrap;background:var(--sunken)}
.tray .msg{font:12px var(--mono);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;margin-left:8px}
.tray .sp{margin-left:auto}

/* pull tabs: physical handles on the bottom edge */
.pulls{display:flex;gap:6px;align-self:stretch;margin:-10px 0}
.pull{display:flex;gap:8px;align-items:center;padding:0 12px;background:var(--tile);background-image:var(--knurl);
  border:2px solid var(--edge);border-top:0;font:600 10px var(--mono);letter-spacing:.1em;color:var(--ink2);
  transform:translateY(-3px);transition:transform 70ms linear}
.pull:hover{transform:translateY(0);color:var(--ink);border-color:var(--edge-hi)}
.pull b{color:var(--ink);font-weight:700}
.pull[aria-expanded=true]{transform:translateY(0);border-color:var(--edge-hi);color:var(--ink)}

/* bottom drawer */
.bdrawer{position:absolute;left:0;right:0;bottom:var(--trayh,52px);max-height:60%;background:var(--tile);border-top:3px solid var(--edge-hi);
  transform:translateY(102%);transition:transform 120ms ease-out;z-index:6;display:grid;grid-template-rows:auto 1fr}
.bdrawer::before{content:"";position:absolute;left:0;right:0;top:-3px;height:5px;background:var(--hazard)}
.bdrawer:not(.open){transform:translateY(calc(100% + var(--trayh,52px) + 8px));visibility:hidden;transition:transform 120ms ease-out,visibility 0s 120ms}
.bdrawer.open{transform:none;visibility:visible}
.bd-head{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:2px solid var(--black)}
.bd-head h2{font-size:15px}
.bd-head .sub{font:11px var(--mono);color:var(--ink3)}
.bd-head .x{margin-left:auto;font:11px var(--mono);border:1px solid var(--edge);padding:2px 6px;color:var(--ink3)}
.bd-body{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0;overflow:hidden}
.bd-main{min-width:0;border-right:2px solid var(--black)}
.bd-side{display:flex;flex-direction:column}
.bd-side .ch{border-top:0}
.sum{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--black)}
.sum div{padding:10px 14px;border-right:1px solid var(--rule)}
.sum div:nth-child(2n){border-right:0}
.sum div:nth-child(n+3){border-top:1px solid var(--rule)}
.sum b{display:block;font:700 18px var(--mono)} .sum span{font:10px var(--mono);letter-spacing:.08em;color:var(--ink3)}
.bt td{height:30px}
.bt .btn{padding:2px 8px;font-size:10px}
.yrs{display:inline-flex;gap:2px;vertical-align:-1px}.yrs i{width:10px;height:10px;border:1px solid var(--ink3)}.yrs i.u{background:var(--edge-hi);border-color:var(--edge-hi)}
.tl{display:grid;grid-template-columns:repeat(9,1fr);margin:12px 14px 14px;border:1px solid var(--edge)}
.tl div{height:54px;border-right:1px solid var(--rule);padding:4px 6px;font:10px var(--mono);color:var(--ink3);position:relative}
.tl div:last-child{border-right:0}
.tl div.now{background:var(--raised);color:var(--ink)}
.tl b{position:absolute;left:4px;right:4px;bottom:5px;font:600 10px var(--mono);color:var(--black);background:var(--edge-hi);padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi{display:grid;grid-template-columns:22px 52px 1fr auto;gap:10px;align-items:center;padding:0 14px;height:34px;border-bottom:1px solid var(--rule);cursor:pointer;transition:transform 70ms linear}
.wi:hover{background:var(--raised);transform:translateX(2px)}
.wi .box{width:14px;height:14px;border:2px solid var(--edge)}
.wi.on{background:var(--raised)} .wi.on .box{background:var(--edge-hi);border-color:var(--edge-hi)}
.wi .k{font:600 10px var(--mono);letter-spacing:.08em;color:var(--ink3)}
.wi .d{font:12px var(--mono)}
.sum .delta .ok{color:var(--green)}.sum .delta .warn{color:var(--amber)}
.sum .delta span{font:inherit}
.sum .delta{display:block;padding:0;border:0;font:11px var(--mono);color:var(--ink3);margin-top:2px}

.elig{font:10px var(--mono);color:var(--ink3);text-align:right}

/* ---------- inspector + custom drawers ---------- */
.insp{background:var(--tile);border-left:3px solid var(--black);display:grid;grid-template-rows:auto auto 1fr auto auto;min-height:0}
.ihead{padding:14px 16px 12px;border-bottom:2px solid var(--black)}
.ihead .top{display:flex;justify-content:space-between;align-items:center}
.ihead .on{font:600 11px var(--mono);color:var(--blue)}
.ihead .nm{font-size:17px;font-weight:700;margin-top:6px}
.ihead .sub{color:var(--ink2);font-size:12px;margin-top:2px}
.nums{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--black)}
.nums div{padding:12px 16px}
.nums div+div{border-left:1px solid var(--edge)}
.nums b{display:block;font:700 26px var(--mono)}
.nums span{font:11px var(--mono);color:var(--ink3)}
.idrawers{overflow:hidden;min-height:0}
.idr{border-bottom:1px solid var(--black)}
.idr>button{width:100%;display:flex;align-items:center;gap:8px;padding:9px 16px;font:600 11px var(--mono);letter-spacing:.08em;color:var(--ink2);text-align:left;transition:transform 70ms linear}
.idr>button:hover{color:var(--ink);transform:translateX(2px)}
.idr>button .c{margin-left:auto;color:var(--ink3)}
.idr.open>button{color:var(--ink);background:var(--raised);box-shadow:inset 3px 0 0 var(--edge-hi)}
.idr .body{display:none;padding:10px 16px 12px;background:var(--canvas)}
.idr.open .body{display:block}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--rule);font-size:12px}
.kv span:last-child{font-family:var(--mono)}
.mine{font:9px var(--mono);letter-spacing:.1em;border:1px solid var(--edge);padding:0 4px;color:var(--ink3)}
.arc{display:flex;align-items:flex-end;gap:3px;height:46px;margin-top:4px}
.arc i{flex:1;background:var(--ink3)} .arc i.now{background:var(--edge-hi)}
.iact{border-top:2px solid var(--black);padding:12px 16px;display:grid;gap:8px}
.iact .h{font:700 10px var(--mono);letter-spacing:.14em;color:var(--ink3)}
.ia{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ifoot{border-top:2px solid var(--black);padding:10px 16px;display:flex;justify-content:space-between;font:11px var(--mono);color:var(--ink3)}
.ifoot button{color:var(--ink2);border:1px dashed var(--edge);padding:3px 8px}
.ok{color:var(--green)} .warn{color:var(--amber)}

/* ---------- v7: workspaces, cap, moves, release, customize ---------- */
.ws{display:none}.ws.on{display:grid}
.work{grid-template-rows:auto auto 1fr auto}
.capws{grid-template-columns:minmax(0,1fr) minmax(430px,32%);min-height:0;border-bottom:2px solid var(--black)}
.ctable{display:flex;flex-direction:column;min-height:0;border-right:2px solid var(--black)}
.ct-wrap{flex:1;min-height:0;overflow:auto}
.ct{width:100%;border-collapse:collapse}
.ct th{position:sticky;top:0;z-index:1;background:var(--sunken);text-align:right;font:600 10px var(--mono);letter-spacing:.12em;color:var(--ink3);padding:7px 10px;border-bottom:2px solid var(--black);white-space:nowrap}
.ct th:nth-child(-n+2){text-align:left}
.ct th.sorted{color:var(--ink)}
.ct td{height:30px;padding:0 10px;border-bottom:1px solid var(--rule);text-align:right;font-family:var(--mono);font-size:12px;white-space:nowrap}
.ct td:nth-child(2){text-align:left;font-family:var(--sans);font-size:13px}
.ct td:first-child{text-align:left;width:44px}
.ct td.off{color:var(--edge)}
.ct td.yr{background:hsla(220,8%,82%,.035);border-left:1px solid var(--rule)}
.ct td.last{position:relative;padding-right:18px}
:root{--rfa:hsl(84,90%,52%);--ufa:hsl(54,100%,54%)}
.cap-end{position:absolute;right:3px;top:5px;bottom:5px;width:9px;border:1px solid var(--black)}
.cap-end,.key-cap{background-image:repeating-linear-gradient(45deg,hsla(220,25%,2%,.55) 0 1px,transparent 1px 3px),repeating-linear-gradient(-45deg,hsla(220,25%,2%,.35) 0 1px,transparent 1px 3px)}
.cap-end.rfa,.key-cap.rfa{background-color:var(--rfa)} .cap-end.ufa,.key-cap.ufa{background-color:var(--ufa)}
.key-cap{display:inline-block;width:9px;height:13px;border:1px solid var(--black);vertical-align:-2px;margin:0 5px 0 12px}
.fa{font:700 10px var(--mono);letter-spacing:.08em;padding:1px 5px;color:var(--black);border:1px solid var(--black)}
.fa.rfa{background:var(--rfa)} .fa.ufa{background:var(--ufa)}
.ct tr{transition:transform 70ms linear;cursor:pointer}
.ct tbody tr:hover{background:var(--raised);transform:translateX(2px)}
.ct tr.sel{background:var(--raised);box-shadow:inset 4px 0 0 var(--edge-hi)}
.ct td small{color:var(--ink3);font:11px var(--mono);margin-left:6px}
.cside{display:flex;flex-direction:column;min-height:0}
.run{padding:10px 14px 12px;display:grid;gap:9px;border-bottom:2px solid var(--black)}
.run .y{display:grid;grid-template-columns:40px 1fr 74px;gap:10px;align-items:center;font:11px var(--mono)}
.run .y .bar{display:flex;height:14px;border:1px solid var(--edge);background:var(--sunken)}
.run .y .bar span{height:100%;border-right:2px solid var(--black)}
.run .y b{text-align:right;font-weight:600}
.run .y.tight b{color:var(--amber)}
.dec{flex:1;min-height:0;overflow:hidden}
.drow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--rule)}
.drow .nm{font-weight:600}
.drow .why{grid-column:2/4;font:11px var(--mono);color:var(--ink2);margin-top:-4px}
.drow .ops{grid-column:2/4;display:flex;gap:6px}
.drow .ops .btn{padding:3px 8px;font-size:10px}
.clock{font:600 11px var(--mono);color:var(--amber);white-space:nowrap}
.clock.cold{color:var(--ink2)}
/* side drawer + nested G3 */
.sdrawer{position:absolute;top:0;right:0;max-height:100%;width:460px;border-bottom:3px solid var(--edge-hi);background:var(--tile);border-left:3px solid var(--edge-hi);
  transform:translateX(104%);transition:transform 120ms ease-out;z-index:7;display:flex;flex-direction:column}
.sdrawer::before{content:"";position:absolute;left:-3px;top:0;bottom:0;width:6px;background:var(--hazard)}
.sdrawer.open{transform:none}
.sd-body{padding:0 18px 14px;display:grid;gap:0;align-content:start;overflow:hidden}
.sd-sec{font:700 10px var(--mono);letter-spacing:.14em;color:var(--ink3);padding:14px 0 6px;border-bottom:1px solid var(--edge);display:flex;justify-content:space-between}
.sd-sec span{font-weight:400;letter-spacing:.04em}
.kv2{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
.rb{display:grid;grid-template-columns:40px 1fr 70px;gap:10px;align-items:center;font:11px var(--mono);padding:5px 0}
.rb .bar{position:relative;height:12px;border:1px solid var(--edge);background:var(--sunken)}
.rb .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--edge-hi)}
.rb .bar i.was{background:transparent;border-right:2px dashed var(--ink3)}
.alt{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.alt b{font-size:13px}.alt small{grid-column:1;font:11px var(--mono);color:var(--ink2)}
.alt .btn{grid-row:1/3;grid-column:2;padding:3px 8px;font-size:10px}
.sd-act{display:flex;gap:8px;padding:12px 18px;border-top:2px solid var(--black);background:var(--sunken)}
.sd-body .kv{font-size:13px;padding:7px 0}
.sd-body .note{font-size:12px;color:var(--ink2);margin:10px 0}
.nested{display:none;margin:0 18px 18px;background:var(--sunken);border:3px solid var(--edge-hi);padding:16px;
  transform:translateY(10px);opacity:0;pointer-events:none;transition:transform 100ms ease-out,opacity 100ms linear}
.nested.open{display:block;transform:none;opacity:1;pointer-events:auto}
.nested h3{font-size:15px}
.nested .g3{font:700 10px var(--mono);letter-spacing:.14em;color:var(--red);margin-bottom:6px}
.hold{position:relative;display:block;width:100%;margin-top:12px;border:3px solid var(--edge-hi);padding:12px;font:700 12px var(--mono);letter-spacing:.12em;overflow:hidden;touch-action:none}
.hold .fill{position:absolute;inset:0;background:var(--hazard);transform:scaleX(0);transform-origin:left;opacity:.6}
.hold span{position:relative;background:var(--black);padding:2px 8px}
.hold.go .fill{transform:scaleX(1);transition:transform 600ms linear}
.hold.done{border-color:var(--green)} .hold.done span{color:var(--green)}
/* my moves: envelope pipeline */
.movews{grid-template-columns:repeat(4,1fr);grid-template-rows:auto 1fr;min-height:0;border-bottom:2px solid var(--black)}
.mlog{grid-column:1/-1;display:flex;flex-direction:column;min-height:0;border-top:2px solid var(--black)}
.mlog .ct td:nth-child(2){font-family:var(--mono);font-size:11px;color:var(--ink3)}
.mlog .ct td:nth-child(3){text-align:left;font-family:var(--sans);font-size:13px}
.mlog .ct td:nth-child(4),.mlog .ct td:nth-child(5){text-align:left}
.mlog .ct th{text-align:left}
.lane{display:flex;flex-direction:column;min-height:0;border-right:2px solid var(--black)}
.lane:last-child{border-right:0}
.lane .ch b{display:flex;gap:8px;align-items:center}
.lane .cards{min-height:0;overflow:hidden;padding:10px;display:grid;gap:8px;align-content:start}
.mv{border:1px solid var(--edge);background:var(--tile);padding:10px 12px;display:grid;gap:5px;transition:transform 70ms linear,box-shadow 70ms linear;cursor:pointer}
.mv:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--black);border-color:var(--edge-hi)}
.mv.g2{border-width:2px}
.mv .top{display:flex;justify-content:space-between;font:600 10px var(--mono);letter-spacing:.1em;color:var(--ink3)}
.mv .what{font-weight:600}
.mv .chk{font:11px var(--mono);color:var(--ink2)}
.mv .bot{display:flex;justify-content:space-between;align-items:center;font:11px var(--mono);color:var(--ink3);border-top:1px solid var(--rule);padding-top:6px}
.mv .bot .btn{padding:2px 8px;font-size:10px}
.st-ok{color:var(--green)} .st-bad{color:var(--red)} .st-wait{color:var(--amber)} .st-info{color:var(--blue)}
.mv.blocked{background:repeating-linear-gradient(-45deg,hsla(220,8%,82%,.07) 0 6px,transparent 6px 12px),var(--tile)}
/* customize */
.leaf .pin{display:none;margin-left:auto;font-family:var(--mono);color:var(--ink3)}
body.editing .leaf .pin{display:inline}
body.editing .leaf .pin.on{color:var(--edge-hi)}
body.editing .rail{outline:2px dashed var(--edge-hi);outline-offset:-6px}
body.editing #sc .leaf .grab{display:inline}
.leaf .grab{display:none;font-family:var(--mono);color:var(--ink3)}
.rail-foot .btn{padding:3px 8px;font-size:10px}
.rail-foot .btn[aria-pressed=true]{background:var(--edge-hi);color:var(--black)}
/* ---------- HOME: jet-black Pulse palette ---------- */
body.home{--canvas:hsl(0,0%,1.6%);--sunken:hsl(0,0%,0%);--tile:hsl(0,0%,4.2%);--raised:hsl(0,0%,7.5%);
  --ink:hsl(40,8%,84%);--ink2:hsl(40,4%,64%);--ink3:hsl(40,3%,47%);--edge:hsl(0,0%,19%);--edge-hi:hsl(40,6%,70%);
  --black:hsl(0,0%,0%);--rule:hsl(0,0%,8%);--mine:hsl(210,62%,62%);--theirs:hsl(36,42%,60%);--live:hsl(145,48%,52%)}
body.home .work{grid-template-rows:auto auto auto auto 1fr auto}

/* layout chip in the tab bar */
.lay{display:flex;align-items:center;gap:8px;padding:0 14px;font:11px var(--mono);color:var(--ink3);border-left:1px solid var(--black)}
.lay b{color:var(--ink2);font-weight:600}
.demo{display:flex;align-items:center;gap:0;padding:0 10px;border-left:1px solid var(--black)}
.demo span{font:9px var(--mono);letter-spacing:.14em;color:var(--ink3);margin-right:8px}
.seg{display:inline-flex;border:2px solid var(--edge)}
.seg button{padding:3px 9px;font:600 10px var(--mono);letter-spacing:.08em;color:var(--ink3);border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--edge-hi);color:var(--black)}

/* NOW strip */
.now{display:flex;align-items:stretch;border-bottom:2px solid var(--black);background:var(--tile);background-image:var(--knurl);min-height:46px}
.now .nl{display:flex;align-items:center;gap:10px;padding:0 18px;flex:1;min-width:0;font-size:14px}
.now .nl .tag{font-size:10px}
.now .nl em{font-style:normal;color:var(--ink2);font:12px var(--mono);margin-left:6px}
.now .st{display:flex;flex-direction:column;justify-content:center;padding:0 18px;border-left:1px solid var(--black);min-width:96px}
.now .st b{font:700 17px var(--mono)} .now .st span{font:9px var(--mono);letter-spacing:.14em;color:var(--ink3)}

/* ALERT BAND: one row, never stacks, never rotates. Not part of the layout. */
.aband{display:flex;align-items:center;gap:12px;height:36px;padding:0 14px 0 22px;position:relative;background:var(--sunken);border-bottom:2px solid var(--black);cursor:pointer;transition:transform 70ms linear}
.aband::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:repeating-linear-gradient(-45deg,var(--amber) 0 6px,var(--black) 6px 12px)}
.aband:hover{transform:translateX(2px)}
.aband .ak{font:700 10px var(--mono);letter-spacing:.12em;color:var(--amber);white-space:nowrap}
.aband .at{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aband .clock{margin-left:4px}
.aband .go{font:600 10px var(--mono);letter-spacing:.08em;border:1px solid var(--edge);padding:2px 7px;color:var(--ink2);white-space:nowrap}
.aband .more{margin-left:auto;font:700 10px var(--mono);letter-spacing:.1em;color:var(--ink2);white-space:nowrap}
.aband .more b{background:var(--amber);color:var(--black);padding:1px 5px;margin-right:6px}
.aband.crit::before{background:repeating-linear-gradient(-45deg,var(--red) 0 6px,var(--black) 6px 12px)} .aband.crit .ak{color:var(--red)}
.aband.unavail::before{background:var(--hatch),var(--edge)} .aband.unavail .ak{color:var(--ink2)}
.aband.none{display:none}

/* TILE GRID: fixed 3 x 2. Positions are packed in JS; nothing ever spills into page scroll. */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:10px;padding:10px;min-height:0;position:relative}
.t{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--canvas);border:1px solid var(--edge);box-shadow:3px 3px 0 var(--black);transition:transform 70ms linear,box-shadow 70ms linear}
.t::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:3px;background:var(--hazard)}
.t:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--black);border-color:var(--edge-hi)}
.t.sel{border-color:var(--edge-hi)}
.t .th{display:flex;align-items:center;gap:8px;padding:11px 12px 8px;border-bottom:1px solid var(--edge)}
.t .th b{font:700 11px var(--mono);letter-spacing:.14em}
.t .th .src{font:10px var(--mono);color:var(--ink3)}
.t .th .lnk{margin-left:auto;font:600 10px var(--mono);letter-spacing:.06em;color:var(--ink2);border:1px solid var(--edge);padding:1px 6px}
.t .th .lnk:hover{color:var(--ink);border-color:var(--edge-hi)}
.t .tb{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.t .tf{display:flex;justify-content:space-between;padding:5px 12px;border-top:1px solid var(--rule);font:10px var(--mono);color:var(--ink3)}
.t .tf .stale{color:var(--amber)}
/* customize chrome */
.t .ed{display:none;align-items:center;gap:4px}
body.editing .t .ed{display:flex}
body.editing .t .lnk{display:none}
body.editing .t{border-style:dashed}
.t .grip{cursor:grab;font:13px var(--mono);color:var(--ink3);padding:0 2px}
.t .pin{font:13px var(--mono);color:var(--ink3);padding:0 2px} .t .pin.on{color:var(--edge-hi)}
.t .sp{font:600 9px var(--mono);border:1px solid var(--edge);padding:1px 4px;color:var(--ink3)}
.t .sp[aria-pressed=true]{background:var(--edge-hi);color:var(--black);border-color:var(--edge-hi)}
.t .sp:disabled{opacity:.35;cursor:not-allowed}
.t .off{font:600 9px var(--mono);border:1px solid var(--edge);padding:1px 5px;color:var(--ink2);margin-left:4px}
.t.over{outline:2px solid var(--edge-hi);outline-offset:-2px}
.t.dragging{opacity:.4}
body.picking .t{cursor:crosshair}
body.picking .t:hover{outline:2px dashed var(--amber);outline-offset:-2px}
body.picking .t .tb{opacity:.55}

/* rows inside tiles: 30px, packed beside the name */
.r{display:grid;align-items:center;gap:10px;height:30px;padding:0 12px;border-bottom:1px solid var(--rule);font-size:12.5px;white-space:nowrap}
.r:hover{background:var(--raised)}
.r .m{font:11px var(--mono);color:var(--ink3)}
.r .nm{overflow:hidden;text-overflow:ellipsis}
.r .k{font:700 9px var(--mono);letter-spacing:.1em;color:var(--ink2);border:1px solid var(--edge);padding:1px 4px;text-align:center}
.r .v{font:600 12px var(--mono);text-align:right}
.dq{grid-template-columns:74px 1fr auto 62px}
.dq .k.lineup,.dq .k.trades{color:var(--amber);border-color:var(--amber)}
.wire{grid-template-columns:52px 46px 1fr}
.hl{grid-template-columns:30px 1fr auto}
.hl .k{border:0;padding:0;color:var(--ink3)}

/* matchup tile */
.mx{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding:12px 14px 8px;gap:10px}
.mx .sd b{display:block;font-size:14px} .mx .sd span{font:11px var(--mono);color:var(--ink3)}
.mx .sd.rt{text-align:right}
.mx .sc{font:700 30px var(--mono)} .mx .vs{font:11px var(--mono);color:var(--ink3);padding-bottom:8px}
.mx .me .sc{color:var(--mine)} .mx .op .sc{color:var(--theirs)}
.wpl{display:flex;justify-content:space-between;padding:0 14px;font:700 13px var(--mono)}
.wpl .g{color:var(--live)} .wpl .a{color:var(--amber)}
.wpb{display:flex;height:6px;margin:4px 14px 10px;border:1px solid var(--edge)} .wpb i{background:var(--mine)} .wpb u{flex:1;background:var(--theirs);opacity:.55}
.prog{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.prog div{padding:6px 12px;border-right:1px solid var(--rule)} .prog div:last-child{border:0}
.prog b{display:block;font:700 15px var(--mono)} .prog span{font:9px var(--mono);letter-spacing:.12em;color:var(--ink3)}
.duo{grid-template-columns:1fr 46px 46px 1fr}
.duo .v.me{color:var(--mine)} .duo .v.op{color:var(--theirs);text-align:left}
.duo .nm.rt{text-align:right}

/* race tile */
.seedl{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--edge)}
.seedl div{padding:10px 12px;border-right:1px solid var(--rule)} .seedl div:last-child{border:0}
.seedl b{display:block;font:700 22px var(--mono)} .seedl span{font:9px var(--mono);letter-spacing:.12em;color:var(--ink3)}
.seedl .arw{color:var(--amber)}
.bub{display:inline-block;font:700 9px var(--mono);letter-spacing:.12em;padding:1px 5px;background:var(--amber);color:var(--black);vertical-align:3px;margin-left:6px}
.runin{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 12px;border-bottom:1px solid var(--edge)}
.runin div{border:1px solid var(--edge);padding:4px 6px;font:10px var(--mono);color:var(--ink3)}
.runin div.lead{border-color:var(--edge-hi)}
.runin div b{display:block;font:600 12px var(--sans);color:var(--ink)}
.runin div i{font-style:normal;font-weight:700}
.runin .g{color:var(--live)} .runin .a{color:var(--amber)}
.mini{grid-template-columns:26px 1fr 48px 44px}
.mini.me{background:var(--raised);box-shadow:inset 3px 0 0 var(--mine)}
.mini.cut{border-bottom:2px dashed var(--edge-hi)}

/* shortcuts tile */
.scg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px;align-content:start}
.scb{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border:2px solid var(--edge);background:var(--tile);background-image:var(--knurl);font-weight:600;font-size:13px;text-align:left;transition:transform 70ms linear,box-shadow 70ms linear}
.scb:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--black);border-color:var(--edge-hi)}
.scb kbd{margin-left:auto;font:10px var(--mono);border:1px solid var(--edge);padding:1px 5px;color:var(--ink3)}
.scb .w{font:10px var(--mono);color:var(--ink3);font-weight:400}

/* power / cap / picks / bids tiles */
.pw{grid-template-columns:26px 1fr 56px 74px}
.pw .bar{height:4px;background:var(--edge)} .pw .bar i{display:block;height:100%;background:var(--edge-hi)}
.pw.me{background:var(--raised);box-shadow:inset 3px 0 0 var(--mine)}
.capr{padding:12px 14px;border-bottom:1px solid var(--edge)}
.capr b{font:700 26px var(--mono)} .capr span{font:10px var(--mono);color:var(--ink3);margin-left:8px}
.capbar{display:flex;height:10px;margin-top:8px;border:1px solid var(--edge)} .capbar i{background:var(--edge-hi)} .capbar u{background:var(--hatch),var(--edge)} .capbar s{flex:1}
.yr{grid-template-columns:52px 1fr 80px}
.pk{grid-template-columns:62px 1fr 80px}
.bd{grid-template-columns:1fr 64px 92px}
.bd .k.hi{color:var(--live);border-color:var(--live)} .bd .k.out{color:var(--amber);border-color:var(--amber)}
.pl{grid-template-columns:18px 1fr 70px}
.pl .bx{width:12px;height:12px;border:2px solid var(--edge)} .pl .bx.on{background:var(--edge-hi);border-color:var(--edge-hi)}
.pl.done .nm{color:var(--ink3);text-decoration:line-through}
.empty{margin:auto;padding:20px;text-align:center;font:11px var(--mono);color:var(--ink3)}

/* add-tile tray + overflow (bottom drawer) */
.addg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 20px 16px}
.at2{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 12px;border:2px solid var(--edge);background:var(--tile);text-align:left;transition:transform 70ms linear,box-shadow 70ms linear}
.at2:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--black);border-color:var(--edge-hi)}
.at2 b{font:700 11px var(--mono);letter-spacing:.1em}
.at2 .s{font:10px var(--mono);color:var(--ink3)}
.at2 .d{grid-column:1/-1;font-size:12px;color:var(--ink2)}
.at2.on{opacity:.4;cursor:default;box-shadow:none;transform:none}
.at2.ov{border-style:dashed}
.bd-sec{padding:12px 20px 0;font:700 10px var(--mono);letter-spacing:.14em;color:var(--ink3)}

/* pick prompt inside the tray */
.tray .msg.ask{color:var(--amber)}

/* alert drawer rows */
.al{display:grid;grid-template-columns:8px 1fr;border-bottom:1px solid var(--edge)}
.al .s{background:repeating-linear-gradient(-45deg,var(--amber) 0 5px,var(--black) 5px 10px)}
.al.crit .s{background:repeating-linear-gradient(-45deg,var(--red) 0 5px,var(--black) 5px 10px)}
.al.low .s{background:var(--edge)}
.al .b{padding:10px 14px}
.al .h{display:flex;align-items:center;gap:8px}
.al .h .k{font:700 9px var(--mono);letter-spacing:.12em;border:1px solid var(--edge);padding:1px 5px;color:var(--ink2)}
.al .h .clock{margin-left:auto}
.al .t1{font-weight:600;margin-top:5px}
.al .t2{font-size:12px;color:var(--ink2);margin-top:2px}
.al .acts{display:flex;gap:6px;margin-top:8px}
.al .acts .btn{padding:3px 8px;font-size:10px}
.al.snz{opacity:.45}
.al .why{font:10px var(--mono);color:var(--ink3);margin-top:6px}

/* inspector: tile contract */
.kv3{display:grid;grid-template-columns:96px 1fr;gap:0;font-size:12px}
.kv3 span{padding:6px 16px;border-bottom:1px solid var(--rule)}
.kv3 span:nth-child(odd){font:10px var(--mono);letter-spacing:.08em;color:var(--ink3);padding-right:0}
body.home .shell{grid-template-columns:224px minmax(0,1fr) 316px}
.t .th{overflow:hidden;white-space:nowrap}
body.editing .t .th .src{display:none}
.r{flex:none}
.tray{min-width:0}.tray .msg{flex:1;min-width:0}

/* v2: top-performer ticker (pauses on hover, stops for reduced motion) */
.tick{display:flex;align-items:stretch;height:34px;border-bottom:2px solid var(--black);background:var(--sunken);overflow:hidden}
.tl0{display:flex;align-items:center;padding:0 14px;font:700 10px var(--mono);letter-spacing:.12em;color:var(--black);background:var(--edge-hi);white-space:nowrap}
.tkw{flex:1;overflow:hidden;position:relative}
.tkr{display:flex;width:max-content;height:100%;animation:tk 70s linear infinite}
.tick:hover .tkr{animation-play-state:paused}
@keyframes tk{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tkr{animation:none}}
.tp{display:flex;align-items:center;gap:14px;padding:0 18px;border-right:1px solid var(--edge);white-space:nowrap;font-size:12.5px}
.tp>b{font:700 11px var(--mono);border:1px solid var(--edge-hi);padding:1px 5px}
.tpi small{font:10px var(--mono);color:var(--ink3)} .tpi i{font:600 12px var(--mono);font-style:normal;color:var(--ink2)}
.tpi.one i{color:var(--live)}
/* NFL news */
.nfb{display:flex;align-items:center;gap:0;padding:8px 12px;border-bottom:1px solid var(--edge)}
.nfb button{padding:3px 10px;font:600 10px var(--mono);letter-spacing:.08em;color:var(--ink3);border:2px solid var(--edge);margin-right:-2px;background:var(--tile)}
.nfb button[aria-pressed=true]{background:var(--edge-hi);color:var(--black);border-color:var(--edge-hi);position:relative}
.nfb span{margin-left:auto;font:10px var(--mono);color:var(--ink3)}
.nw{grid-template-columns:42px 50px 1fr auto;height:46px}
.nw .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis} .nw .nm small{font:10px var(--mono);color:var(--ink3)}
.nw .own{font:600 10px var(--mono);color:var(--ink3);text-align:right}
.nw.o-mine{box-shadow:inset 3px 0 0 var(--mine)} .nw.o-mine .own{color:var(--mine)}
.nw.o-opp .own{color:var(--theirs)} .nw.o-wire .own{color:var(--live)}
.k.n-inj,.k.n-ir,.k.n-susp{color:var(--red);border-color:var(--red)}
.k.n-depth{color:var(--live);border-color:var(--live)}
.k.n-trade,.k.n-sign{color:var(--ink);border-color:var(--edge-hi)}
/* transactions: kind is a solid block, wire drops stand out */
.wire{grid-template-columns:42px 52px 1fr;height:40px}
.wire .nm small{display:block;font:10px var(--mono);color:var(--ink3)}
.tx{font:700 9px var(--mono);letter-spacing:.1em;text-align:center;padding:2px 0;border:1px solid var(--edge);color:var(--ink2)}
.tx.t-trade{background:var(--edge-hi);color:var(--black);border-color:var(--edge-hi)}
.tx.t-wire{background:repeating-linear-gradient(-45deg,var(--live) 0 4px,hsl(145,40%,30%) 4px 8px);color:var(--black);border-color:var(--live)}
.tx.t-bid,.tx.t-fa{color:var(--live);border-color:var(--live)}
.tx.t-ir{color:var(--red);border-color:var(--red)}
.tx.t-cut{color:var(--amber);border-color:var(--amber)}
.wire:has(.t-wire) .nm small{color:var(--live)}
/* shortcuts grouped by home screen */
.scx{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 12px;flex:1;min-height:0}
.scgp{display:flex;flex-direction:column;gap:6px}
.sch{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:4px;border-bottom:2px solid var(--edge)}
.sch b{font:700 10px var(--mono);letter-spacing:.12em} .sch span{font:9px var(--mono);color:var(--ink3)}
.scx .scb{height:auto;flex:1;max-height:64px;font-size:12.5px;padding:0 10px}
.scf{padding:6px 12px 8px;font:10px var(--mono);color:var(--ink3);border-top:1px solid var(--rule)}
.nfb button{white-space:nowrap}.nfb span{white-space:nowrap}
.tx.t-wire{background:var(--live);color:var(--black);border-color:var(--live);box-shadow:3px 0 0 var(--black),5px 0 0 var(--live)}

/* v3: full cards for news and transactions. Content-sized, centered in the work area, hard edges, no blur. */
.scrim{position:absolute;inset:0;background:hsla(0,0%,0%,.72);z-index:8;display:none}.scrim.open{display:block}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;display:none;width:min(1080px,92%);max-height:92%;
  background:var(--canvas);border:2px solid var(--edge-hi);box-shadow:8px 8px 0 var(--black)}
.card.open{display:block}
.card::before{content:"";position:absolute;left:-2px;right:-2px;top:-2px;height:5px;background:var(--hazard)}
.ch2{display:flex;align-items:center;gap:12px;padding:16px 22px 0}
.ch2 .k,.ch2 .tx{font:700 10px var(--mono);letter-spacing:.1em;padding:2px 8px;border:1px solid}
.cardx{margin-left:auto;font:11px var(--mono);border:1px solid var(--edge);padding:2px 6px;color:var(--ink3)}
.hd{font-size:24px;line-height:1.25;padding:10px 22px 16px;border-bottom:2px solid var(--black)}
.nbody{display:grid;grid-template-columns:1fr 340px}
.blurb{padding:16px 22px;font-size:15px;line-height:1.6;max-width:70ch} .blurb p+p{margin-top:12px;color:var(--ink2)}
.pcard{border-left:2px solid var(--black);padding:0 18px 14px;background:var(--tile)}
.pcard .kv b,.kvc .kv b{font-weight:600}
.pcard .kv b.o-mine{color:var(--mine)} .pcard .kv b.o-opp{color:var(--theirs)} .pcard .kv b.o-wire{color:var(--live)}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px;border-top:2px solid var(--black);background:var(--sunken)}
.kvc{padding:8px 22px 14px;max-width:720px} .kvc .kv{font-size:14px;padding:8px 0}
.tgrid{display:grid;grid-template-columns:1fr 54px 1fr;padding:16px 22px;gap:0;align-items:start}
.tside{border:1px solid var(--edge);background:var(--tile)}
.tsh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;border-bottom:2px solid var(--black)}
.tsh b{font-size:16px} .tsh span{font:10px var(--mono);letter-spacing:.08em;color:var(--ink3)}
.tas{grid-template-columns:1fr auto 110px;height:36px}
.tst{display:flex;justify-content:space-between;padding:8px 14px;font:11px var(--mono);color:var(--ink2);background:var(--sunken)}
.tmid{align-self:center;text-align:center;font:700 22px var(--mono);color:var(--edge-hi)}
.nw,.wire{cursor:pointer}
.card.small{width:620px}.card.small .kvc{max-width:none}.card.wide{width:min(1180px,94%)}
.tkr{animation-duration:240s}.tp{gap:22px}.tpi u{text-decoration:none;font:700 11px var(--mono);color:var(--ink3);margin-right:6px}.tpi em{font:11px var(--mono);font-style:normal;color:var(--ink2);margin-left:4px}.tpi i{margin-left:6px}

/* ---------- v5: palettes (Home leaves jet black) ---------- */
body.home.pal-slate{--canvas:hsl(214,24%,10%);--sunken:hsl(214,28%,6.5%);--tile:hsl(214,20%,13%);--raised:hsl(214,18%,17%);
  --ink:hsl(210,22%,90%);--ink2:hsl(212,12%,71%);--ink3:hsl(212,10%,55%);--edge:hsl(214,14%,27%);--edge-hi:hsl(210,14%,78%);--black:hsl(216,32%,4%);--rule:hsl(214,18%,15%)}
body.home.pal-graphite{--canvas:hsl(30,5%,10%);--sunken:hsl(30,6%,6%);--tile:hsl(30,4%,13%);--raised:hsl(30,4%,17%);
  --ink:hsl(36,14%,88%);--ink2:hsl(34,7%,69%);--ink3:hsl(32,5%,53%);--edge:hsl(30,4%,27%);--edge-hi:hsl(36,9%,76%);--black:hsl(30,8%,3%);--rule:hsl(30,4%,15%)}
body.home.pal-grey{--canvas:hsl(220,6%,16%);--sunken:hsl(220,7%,11%);--tile:hsl(220,6%,20%);--raised:hsl(220,6%,24%);
  --ink:hsl(220,12%,93%);--ink2:hsl(220,7%,74%);--ink3:hsl(220,5%,60%);--edge:hsl(220,6%,34%);--edge-hi:hsl(220,8%,82%);--black:hsl(220,10%,6%);--rule:hsl(220,6%,22%)}
body.home .work{grid-template-rows:auto auto auto auto minmax(0,1fr) auto}
.ws-tabs{grid-row:1}.now{grid-row:2}.aband{grid-row:3}.tick{grid-row:4}.grid,.wsx{grid-row:5}.tray{grid-row:6}
.wsx{display:none;min-height:0;overflow:hidden}.wsx.on{display:grid}
body.tab-depth .grid,body.tab-stats .grid{display:none}
[data-pl]{cursor:pointer}[data-pl]:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- depth charts ---------- */
#ws-depth{grid-template-columns:250px minmax(0,1fr)}
.tpk{border-right:2px solid var(--black);background:var(--tile);overflow:hidden;display:flex;flex-direction:column}
.tpk .dv{padding:7px 12px 3px;font:700 9px var(--mono);letter-spacing:.14em;color:var(--ink3)}
.tpk .tm{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center;padding:0 12px;height:21px;font-size:12px;text-align:left;width:100%;transition:transform 70ms linear}
.tpk .tm:hover{background:var(--raised);transform:translateX(2px)}
.tpk .tm.on{background:var(--raised);box-shadow:inset 3px 0 0 var(--edge-hi);font-weight:700}
.tpk .tm b{font:700 10px var(--mono);color:var(--ink2)}
.dmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.dhead{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:2px solid var(--black)}
.dhead h2{font-size:18px}.dhead .m{font:11px var(--mono);color:var(--ink3)}
.leg{margin-left:auto;display:flex;gap:12px;font:10px var(--mono);color:var(--ink3)}
.leg i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
.dseg{display:flex;padding:8px 16px;gap:0;border-bottom:1px solid var(--edge)}
.dbody{flex:1;min-height:0;overflow:auto;padding:0 16px 10px}
.dsec{font:700 11px var(--mono);letter-spacing:.14em;padding:10px 0 5px;display:flex;gap:10px;align-items:baseline}
.dsec span{font:400 10px var(--mono);color:var(--ink3);letter-spacing:.04em}
.dt{width:100%;border-collapse:collapse;table-layout:fixed}
.dt th{font:600 9px var(--mono);letter-spacing:.1em;color:var(--ink3);text-align:left;padding:4px 8px;background:var(--sunken);border-bottom:1px solid var(--edge)}
.dt td{height:27px;padding:0 8px;border-bottom:1px solid var(--rule);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt td:first-child{font:700 11px var(--mono);color:var(--ink2);width:50px}
.dt td.no{font:11px var(--mono);color:var(--ink3);width:30px;text-align:right;padding-right:4px}
.dt tr:hover td{background:var(--raised)}
.dt small{font:10px var(--mono);color:var(--ink3);margin-left:5px}
.o-me{color:var(--mine);font-weight:600}.o-op{color:var(--ink)}.o-fa{color:var(--live)}
.qb{display:inline-block;font:700 8px var(--mono);background:var(--red);color:var(--black);padding:0 3px;margin-left:5px;vertical-align:1px}
.rk{display:inline-block;font:700 8px var(--mono);border:1px solid var(--amber);color:var(--amber);padding:0 3px;margin-left:5px;vertical-align:1px}

/* ---------- NFL stats ---------- */
#ws-stats{grid-template-columns:270px minmax(0,1fr)}
.flt{border-right:2px solid var(--black);background:var(--tile);display:flex;flex-direction:column;overflow:hidden}
.flt .fs{padding:10px 14px;border-bottom:1px solid var(--edge)}
.flt .fs>b{display:block;font:700 9px var(--mono);letter-spacing:.14em;color:var(--ink3);margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{padding:3px 8px;font:600 10px var(--mono);border:2px solid var(--edge);color:var(--ink2);background:var(--canvas)}
.chips button[aria-pressed=true]{background:var(--edge-hi);color:var(--black);border-color:var(--edge-hi)}
.vw{display:flex;justify-content:space-between;width:100%;padding:6px 8px;font-size:12.5px;text-align:left;border-left:3px solid transparent;transition:transform 70ms linear}
.vw:hover{background:var(--raised);transform:translateX(2px)}
.vw.on{background:var(--raised);border-left-color:var(--edge-hi);font-weight:600}
.vw span{font:10px var(--mono);color:var(--ink3)}
.rng{display:flex;align-items:center;gap:6px;font:11px var(--mono)}
.rng select,.flt select{background:var(--canvas);color:var(--ink);border:2px solid var(--edge);font:11px var(--mono);padding:3px 4px}
.smain{display:flex;flex-direction:column;min-width:0;min-height:0}
.shead{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--black)}
.shead h2{font-size:16px}.shead .m{font:11px var(--mono);color:var(--ink3)}
.shead .sp2{margin-left:auto;display:flex;gap:8px}
.swrap{flex:1;min-height:0;overflow:auto}
.st2{width:100%;border-collapse:collapse}
.st2 th{position:sticky;top:0;z-index:1;font:600 9.5px var(--mono);letter-spacing:.08em;color:var(--ink3);text-align:right;padding:7px 10px;background:var(--sunken);border-bottom:2px solid var(--black);cursor:pointer;white-space:nowrap}
.st2 th:nth-child(-n+3){text-align:left}
.st2 th.sorted{color:var(--ink);box-shadow:inset 0 -3px 0 var(--edge-hi)}
.st2 th.ff,.st2 td.ff{background:hsla(145,40%,40%,.10)}
.st2 th.ff{color:var(--live)}
.st2 td{height:30px;padding:0 10px;border-bottom:1px solid var(--rule);text-align:right;font:12px var(--mono);white-space:nowrap}
.st2 td:nth-child(-n+3){text-align:left;font-family:var(--sans);font-size:12.5px}
.st2 td.ff{font-weight:700;color:var(--ink)}
.st2 td.rkn{color:var(--ink3);font:11px var(--mono);width:34px}
.st2 tr:hover td{background:var(--raised)}
.st2 td.own{font:10px var(--mono);text-align:left}

/* ---------- player card ---------- */
.pc-h{display:grid;grid-template-columns:120px 1fr 1fr;gap:0 22px;padding:16px 22px;border-bottom:2px solid var(--black)}
.ph2{width:120px;height:144px;border:2px solid var(--edge);background:var(--hatch),var(--tile);display:flex;align-items:flex-end;justify-content:space-between;padding:6px;font:700 22px var(--mono);color:var(--ink3)}
.ph2 span{font:10px var(--mono)}
.pc-h .kv{font-size:13px;padding:5px 0}.pc-h .kv b{font-weight:600}
.pc-tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:2px solid var(--black)}
.pc-tabs button{padding:11px;font:700 11px var(--mono);letter-spacing:.12em;color:var(--ink3);border-right:1px solid var(--black);background:var(--tile)}
.pc-tabs button[aria-selected=true]{background:var(--canvas);color:var(--ink);box-shadow:inset 0 3px 0 var(--edge-hi)}
.pc-act{display:flex;gap:8px;padding:10px 22px;border-bottom:1px solid var(--edge)}
.pc-body{max-height:440px;overflow:auto}
.pc-body .st2 td{height:28px}
.pc-body .nwi{padding:12px 22px;border-bottom:1px solid var(--rule)}
.pc-body .nwi b{display:flex;justify-content:space-between;font-size:13.5px}.pc-body .nwi b span{font:10px var(--mono);color:var(--ink3)}
.pc-body .nwi p{margin-top:5px;color:var(--ink2);font-size:13px;line-height:1.5}
.tot td{font-weight:700;background:var(--sunken)}
.dhead h2{white-space:nowrap}.dhead .m{white-space:nowrap}.leg{flex-wrap:wrap;justify-content:flex-end;row-gap:2px}.leg span{white-space:nowrap}

// ---------- packer: fixed 3 cols x 2 rows ----------
function pack(lay){const g=[[0,0,0],[0,0,0]],out=[];
  for(const [id,sp] of lay){const [w,h]=sp.split("x").map(Number);let ok=false;
    for(let r=0;r<=2-h&&!ok;r++)for(let c=0;c<=3-w&&!ok;c++){let free=true;
      for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++)if(g[y][x])free=false;
      if(free){for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++)g[y][x]=1;out.push([id,sp,r,c,w,h]);ok=true}}
    if(!ok)return null}
  return out}

  else{$("#bdt").textContent="OVERFLOW";$("#bds").textContent="tiles you moved off the grid · kept, never deleted";
    $("#bdb").innerHTML=H.over.length?`<div class="addg">${H.over.map(id=>`<button class="at2 ov" data-add="${id}"><b>${T[id].t}</b><span class="s">RESTORE</span><span class="d">${T[id].src}</span></button>`).join("")}</div>`

function toCustom(){if(H.mode==="default"){H.lay=curLay();H.mode="custom"}}
function place(id,sp){toCustom();const L=H.lay.filter(x=>x[0]!==id);const i=H.lay.findIndex(x=>x[0]===id);
  const N=[...L];N.splice(i<0?N.length:i,0,[id,sp]);
  if(pack(N)){H.lay=N;H.over=H.over.filter(x=>x!==id);return true}
  H.pick={id,sp};return false}
function bump(victim){const {id,sp}=H.pick;H.pick=null;toCustom();
  const i=H.lay.findIndex(x=>x[0]===victim);let N=H.lay.filter(x=>x[0]!==victim&&x[0]!==id);N.splice(Math.min(i,N.length),0,[id,sp]);
  if(!pack(N)){$("#tmsg").textContent=`Still no room after moving ${T[victim].t} · pick another`;H.pick={id,sp};return}
  H.lay=N;H.over=[...H.over.filter(x=>x!==id),victim]}

  if(t.closest("#aband")){$("#bd").classList.remove("open");$("#sd").classList.toggle("open");renderAlerts();renderTray();return}

    if(place(id,T[id].spans[0])){openBd($("#bd").dataset.k);openBd($("#bd").dataset.k)}else{closeAll();document.body.classList.add("picking")}render();return}

  if(t.classList.contains("pin")){H.pins[id]=!H.pins[id];render();return}
  if(t.classList.contains("off")){toCustom();H.lay=H.lay.filter(x=>x[0]!==id);H.over.push(id);render();return}
  H.sel=id;render()});

const COLS={QB:[["GP","gp"],["CMP-ATT","ca"],["PASS YD","py"],["TD","ptd"],["INT","int"],["RUSH YD","ry"],["R TD","rtd"]],
 RB:[["GP","gp"],["ATT","att"],["RUSH YD","ry"],["YPC","ypc"],["R TD","rtd"],["TGT","tgt"],["REC","rec"],["REC YD","recy"],["REC TD","rectd"]],
 WR:[["GP","gp"],["TGT","tgt"],["REC","rec"],["REC YD","recy"],["Y/R","ypr"],["REC TD","rectd"],["RUSH YD","ry"]],
 TE:[["GP","gp"],["TGT","tgt"],["REC","rec"],["REC YD","recy"],["Y/R","ypr"],["REC TD","rectd"]],
 DL:[["GP","gp"],["TKL","tkl"],["AST","ast"],["SACK","sk"],["TFL","tfl"],["QH","qh"],["FF","ff"]],LB:[["GP","gp"],["TKL","tkl"],["AST","ast"],["SACK","sk"],["TFL","tfl"],["INT","dint"],["PD","pd"]],

function statsFor(pos,name,team,i){const r=k=>hsh(name+k)%1000/1000,g=8-(hsh(name+"g")%3===0?1:0),s={gp:g};const tier=1-i*0.06;
  if(pos==="QB"){const att=Math.round(g*(30+r("a")*8));s.ca=`${Math.round(att*(.6+r("c")*.1))}-${att}`;s.py=Math.round(g*(220+r("y")*90)*tier);s.ptd=Math.round(g*(1.4+r("t")*1.0)*tier);s.int=Math.round(g*(.4+r("i")*.5));s.ry=Math.round(g*(5+r("r")*35));s.rtd=Math.round(r("rt")*5*tier);
    s.ff=s.py/25+s.ptd*4-s.int*2+s.ry/10+s.rtd*6}
  else if(pos==="RB"||pos==="WR"||pos==="TE"){const rb=pos==="RB";s.att=rb?Math.round(g*(10+r("a")*9)*tier):Math.round(r("a")*6);s.ry=Math.round(s.att*(3.8+r("y")*1.4));s.ypc=s.att?(s.ry/s.att).toFixed(1):"–";s.rtd=rb?Math.round(g*.6*tier*r("t")+1):0;
    s.tgt=Math.round(g*(rb?3+r("tg")*3:pos==="WR"?6+r("tg")*4:4+r("tg")*3)*tier);s.rec=Math.round(s.tgt*(.62+r("c")*.12));s.recy=Math.round(s.rec*(rb?7.5:pos==="WR"?12.5+r("yr")*3:10.5+r("yr")*2));s.ypr=s.rec?(s.recy/s.rec).toFixed(1):"–";s.rectd=Math.round(g*(rb?.15:.45)*tier*(.6+r("rt")));
    s.ff=s.ry/10+s.rtd*6+s.rec+s.recy/10+s.rectd*6}
  else if(pos==="K"){const a=Math.round(g*(1.8+r("a"))),m=Math.round(a*(.8+r("m")*.18));s.fg=`${m}-${a}`;s.lng=45+Math.round(r("l")*15);s.xp=Math.round(g*(2+r("x")*1.5));s.ff=m*3+s.xp}
  else{s.tkl=Math.round(g*(pos==="LB"?6+r("t")*3:pos==="DB"?4+r("t")*2:2.5+r("t")*1.5)*tier);s.ast=Math.round(g*(1+r("as")*2));s.sk=pos==="DL"?+(g*(.3+r("s")*.5)*tier).toFixed(1):+(r("s")*3).toFixed(1);s.tfl=Math.round(g*(.4+r("tf")*.6));s.qh=Math.round(g*(.8+r("q")*1.2));
    s.dint=Math.round(r("i")*(pos==="DB"?4:pos==="LB"?2:0));s.pd=Math.round(g*(pos==="DB"?.6+r("p"):.2+r("p")*.3));s.ff2=Math.round(r("f")*3);s.ff=s.tkl*1.5+s.ast*.75+s.sk*4+s.dint*4+s.pd*1.5+s.ff2*3}
  s.ff=+s.ff.toFixed(1);s.ppg=+(s.ff/g).toFixed(1);return s}

  const pl=t.closest("[data-pl]");
  if(t.closest("[data-tab]"))setTab(t.closest("[data-tab]").dataset.tab);
  else if(t.closest("#pal button")){const p=t.dataset.pal;document.body.classList.remove("pal-slate","pal-graphite","pal-grey");document.body.classList.add("pal-"+p);$$("#pal button").forEach(b=>b.setAttribute("aria-pressed",b===t))}
  else if(pl&&!H.edit){const [n,p,tm]=pl.dataset.pl.split("|");playerCard(n,p,tm)}
  else if(t.closest("[data-pct]")){H.pc.tab=t.closest("[data-pct]").dataset.pct;playerCard(H.pc.name,H.pc.pos,H.pc.team)}
  else if(t.closest("[data-team]")){H.team=t.closest("[data-team]").dataset.team;renderDepth()}
  else if(t.closest("[data-dsec]")){H.dsec=t.closest("[data-dsec]").dataset.dsec;renderDepth()}
  else if(t.closest("[data-pos]")){H.pos=t.closest("[data-pos]").dataset.pos;H.view=null;H.sort="ff";renderStats()}
  else if(t.closest("[data-own]")){H.own=t.closest("[data-own]").dataset.own;H.view=null;renderStats()}
  else if(t.closest("[data-sort]")){H.sort=t.closest("[data-sort]").dataset.sort;renderStats()}
  else if(t.closest("[data-view]")){const v=VIEWS.find(x=>x[0]===t.closest("[data-view]").dataset.view);H.view=v[0];H.pos=v[2];H.own=v[3];H.wk=v[4];H.sort="ff";renderStats()}
  else hit=false;
  if(hit){e.stopPropagation();e.preventDefault()}},true);
// news card PLAYER › opens the career card
document.addEventListener("click",e=>{const b=e.target.closest(".btn");if(b&&b.textContent.startsWith("PLAYER")&&$("#card").classList.contains("open")){const h=$("#card .hd").textContent;const m=h.match(/^(\S+)\s+\((\w+)\s+(\w+)\)/);if(m){e.stopPropagation();playerCard(m[1],m[3],m[2])}}},true);
setTab("brief");
</script></body></html>
