<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password · The War Room</title>
<style nonce="__CSP_NONCE__">
  :root{--bg:#0f1216;--panel:#171c22;--line:#2a323c;--text:#e8ecf0;--dim:#8b96a3;--edge:#f2b632}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:28px 16px}
  main{width:100%;max-width:460px}
  header{border-bottom:3px solid var(--edge);padding-bottom:12px;margin-bottom:20px;display:flex;align-items:baseline;justify-content:space-between}
  h1{font-size:24px;letter-spacing:.5px}
  .league{color:var(--dim);font-size:14px}
  h2{font-size:18px;margin-bottom:6px}
  p.help{color:var(--dim);font-size:14px;margin-bottom:14px}
  form{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--edge);border-radius:3px;padding:18px;display:grid;gap:12px}
  label{font-size:13px;color:var(--dim);display:grid;gap:5px}
  input{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:10px;border-radius:3px;font:inherit}
  input:focus{outline:none;border-color:var(--edge)}
  .go{background:var(--edge);color:#111;border:0;padding:11px 20px;font-weight:700;border-radius:3px;cursor:pointer;font:inherit;font-weight:700}
  .go[disabled]{opacity:.5;cursor:not-allowed}
  .error{color:#ff8f8f;font-size:14px;min-height:1.2em}
  .ok{color:#3fbf7f;font-size:14px;min-height:1.2em}
</style>
</head>
<body>
<main>
  <header><h1>THE WAR ROOM</h1><span class="league">Account</span></header>
  <h2>Change your password</h2>
  <p class="help">Enter your current password and choose a new one. After the change, every device (including this one) signs in again with the new password.</p>
  <form id="changeForm">
    <label>Sign-in name<input id="username" autocomplete="username" minlength="3" maxlength="64" required></label>
    <label>Current password<input id="oldPassword" type="password" autocomplete="current-password" required></label>
    <label>New password (at least 10 characters)<input id="newPassword" type="password" autocomplete="new-password" minlength="10" required></label>
    <button class="go" id="submit">Change password</button>
    <p class="ok" id="ok"></p>
    <p class="error" id="error"></p>
  </form>
</main>
<script nonce="__CSP_NONCE__">
  (function () {
    "use strict";
    function $(id) { return document.getElementById(id); }
    $("changeForm").addEventListener("submit", function (event) {
      event.preventDefault();
      $("ok").textContent = "";
      $("error").textContent = "";
      $("submit").disabled = true;
      fetch("/v1/auth/password/change", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          protocol: 1,
          username: $("username").value,
          oldPassword: $("oldPassword").value,
          newPassword: $("newPassword").value
        })
      }).then(function (response) {
        return response.text().then(function (text) {
          if (!response.ok) throw new Error((text || "").trim() || "Password change refused.");
          $("changeForm").reset();
          $("ok").textContent = "Password changed. Sign in again with your new password.";
        });
      }).catch(function (err) {
        $("error").textContent = err.message;
      }).finally(function () { $("submit").disabled = false; });
    });
  }());
</script>
</body>
</html>
